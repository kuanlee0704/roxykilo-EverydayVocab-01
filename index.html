<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="app-light.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f3f4f8">
<script>
window.ACCENTS={
 indigo:{n:'靛藍',L:['#4a58a8','#3c4994'],D:['#4a5acb','#a3b1ff']},
 slate:{n:'霧藍',L:['#4f6783','#3f566f'],D:['#4d6685','#a9c0dc']},
 teal:{n:'青綠',L:['#2f847f','#256c68'],D:['#2b7f7a','#82d8d0']},
 rose:{n:'玫瑰',L:['#b94c6c','#a23c5b'],D:['#a8466a','#f0a6bd']},
 amber:{n:'琥珀',L:['#a8651f','#8f5414'],D:['#9a5d1c','#f0c47e']}};
window.applyTheme=function(){
 var mode='auto',acc='indigo';
 try{mode=localStorage.getItem('dw_theme')||'auto';acc=localStorage.getItem('dw_accent')||'indigo'}catch(e){}
 if(!ACCENTS[acc])acc='indigo';
 var dark=mode==='dark'||(mode==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
 var r=document.documentElement;r.dataset.theme=dark?'dark':'light';r.style.colorScheme=dark?'dark':'light';
 var a=ACCENTS[acc][dark?'D':'L'];r.style.setProperty('--pri-solid',a[0]);r.style.setProperty('--pri',a[1]);
 var l=document.querySelector('link[rel=manifest]'),h=dark?'app-dark.webmanifest':'app-light.webmanifest';if(l&&l.getAttribute('href')!==h)l.setAttribute('href',h);
 var m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0e1015':'#f3f4f8';
};
applyTheme();
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',function(){applyTheme();window.onThemeChange&&onThemeChange()});
</script>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="單字本">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>每日單字本</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--text:#1d2130;--sub:#687083;--pri:#3c4994;--pri-solid:#4a58a8;--line:#e3e6ee;--danger:#d64550;--ok:#5fa05a;--chip-text:#fff;--shadow:0 1px 2px rgba(20,24,40,.05);--tint:8%}
:root[data-theme="dark"]{--bg:#0e1015;--card:#171a21;--text:#e7e9ef;--sub:#8b93a5;--line:#252a35;--danger:#ef6b73;--ok:#538d4e;--chip-text:#12141a;--shadow:none;--tint:15%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Noto Sans TC",sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:20px;margin:0 0 12px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;color:var(--sub);border-radius:0;padding:14px 0;font-size:15px}
.tabs button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font-size:16px;margin-bottom:8px}
textarea{font:12px/1.4 ui-monospace,monospace;height:200px}
button{padding:10px 14px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-size:15px;cursor:pointer;white-space:nowrap}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
button.del{background:transparent;color:var(--danger);padding:4px 8px}
button:disabled{opacity:.5}
.word{font-size:20px;font-weight:700}
.meta{color:var(--sub);font-size:13px}
.ex{background:var(--bg);border-radius:8px;padding:6px 8px;margin-top:4px;font-size:14px}
.hd{display:flex;justify-content:space-between;align-items:flex-start}
details summary{cursor:pointer;color:var(--sub);font-size:14px;margin-top:6px}
.msg{font-size:13px;color:var(--sub);min-height:18px}.err{color:var(--danger)}
.day{font-size:14px;font-weight:700;margin:18px 4px 6px}
.chip{display:inline-block;font-size:12px;color:#fff;border-radius:999px;padding:0 8px;margin-right:6px}
.lv{display:inline-block;font-size:11px;border:1px solid var(--line);color:var(--sub);border-radius:6px;padding:0 5px;margin-left:4px}
.bar{display:flex;gap:6px;margin-bottom:10px}
.bar button{flex:1;padding:6px}
.pane{display:none}.pane.on{display:block}
.pos{color:var(--pri);font-weight:700;margin-right:4px}
.pv{margin:6px 0;font-size:16px}
.sec{border-top:1px solid var(--line);padding-top:8px;margin-top:10px}
.sense{margin:6px 0 8px 6px}

/* 日曆 */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--pri);line-height:1.2}
.stat span{font-size:11px;color:var(--sub)}
.cal-hd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.cal-hd .t{flex:1;text-align:center;font-weight:700;font-size:17px}
.cal-hd button{padding:6px 12px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cell{min-height:66px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px 4px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.cell.out{opacity:.4}
.cell.has{background:color-mix(in srgb,var(--pri) 9%,var(--card))}
.cell.today .n{color:#fff;background:var(--pri);border-radius:999px;padding:0 6px;align-self:flex-start;font-weight:700}
.cell.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.cell .n{font-size:12px;color:var(--sub);line-height:1.5}
.cell .w{font-size:10px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid;padding-left:3px}
.cell .more{font-size:10px;color:var(--sub);padding-left:3px}
.dhd{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;gap:8px}
.dhd b{font-size:15px}
.dhd button{padding:6px 10px;font-size:14px}
.mon>summary{font-weight:700;color:var(--text);font-size:15px;margin:14px 4px 6px}
.seg{display:flex;gap:4px;margin-bottom:10px}
.seg button{flex:1;background:transparent;color:var(--sub);border:1px solid var(--line);padding:6px 0;font-size:14px}
.seg button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cell .w.wd{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 22%,transparent);font-weight:700}

/* Wordle */
.tiles{display:flex;gap:4px;margin:8px 0;align-items:center}
.tile{width:36px;height:36px;background:var(--ok);color:#fff;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;border-radius:4px;text-transform:uppercase}
.sc{display:inline-block;min-width:48px;text-align:center;border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;color:#fff}
.sc.ok{background:var(--ok)}.sc.bad{background:var(--danger)}.sc.na{background:var(--line);color:var(--sub)}
.sc.win{box-shadow:0 0 0 2px #e0b83c}
.scs{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.wst{width:100%;border-collapse:collapse;font-size:14px;text-align:center}
.wst th{font-size:12px;color:var(--sub);font-weight:400;padding-bottom:4px}
.wst td{padding:4px 0}
.wst td:first-child,.wst th:first-child{text-align:left}
.wst td b{color:var(--pri)}

/* ===== 響應式:手機(預設)→ 平板 → 電腦 ===== */
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
html{-webkit-text-size-adjust:100%}
button,.cell{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{padding-bottom:calc(92px + env(safe-area-inset-bottom))}

/* 手機:底部導覽(圖示在上、文字在下) */
.tabs{padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0 6px;font-size:11px;min-height:56px}
.tabs .ic{font-size:21px;line-height:1}
.tabs .brand,.tabs .me{display:none}

/* 手機:日曆格只放小圓點,細節看下方當天清單 */
.cell{min-height:54px;padding:5px 2px;align-items:center;gap:4px}
.cell .n,.cell.today .n{align-self:center}
.cell .w,.cell .more{display:none}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.dot{width:7px;height:7px;border-radius:50%}
.dot.wd{background:var(--ok);border-radius:2px}
.grid{gap:3px}
.stats{gap:5px}
.seg button{padding:9px 0}

/* 當天標題與按鈕:標題一行,按鈕平均排一列 */
.dhd{flex-direction:column;align-items:stretch;gap:8px}
.dact{display:flex;gap:6px}
.dact button{flex:1;white-space:nowrap}

/* 觸控裝置:按鈕加大好點 */
@media(pointer:coarse){
  button.del{padding:8px 12px;font-size:17px}
  .dhd button{padding:10px 8px}
  .bar button{padding:10px}
}
#dlg{max-height:90vh;overflow:auto}
#e-json{height:150px}
.w-side{display:flex;flex-direction:column}

/* 平板:日曆格改顯示文字 */
@media(min-width:600px){
  .wrap{max-width:760px}
  .cell{min-height:92px;align-items:stretch;padding:4px 6px;gap:3px}
  .cell .n,.cell.today .n{align-self:flex-start}
  .cell .w{display:block;font-size:12px}
  .cell .more{display:block;font-size:11px}
  .dots{display:none}
  .cell:hover{border-color:var(--pri)}
  .grid{gap:4px}
  .tile{width:40px;height:40px;font-size:22px}
  #e-json{height:200px}
}

/* 電腦:左側導覽 + 雙欄版面 */
@media(min-width:900px){
  body{padding-left:232px}
  .wrap{max-width:1120px;padding:28px 32px 48px}
  h1{font-size:24px;margin-bottom:16px}
  .tabs{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 14px;border-top:0;border-right:1px solid var(--line)}
  .tabs .brand{display:block;font-weight:700;font-size:18px;padding:4px 12px 18px}
  .tabs button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;border-radius:10px;font-size:15px;min-height:0}
  .tabs button:hover{background:var(--bg)}
  .tabs button.on{background:color-mix(in srgb,var(--pri) 12%,var(--card))}
  .tabs .ic{font-size:18px}
  .tabs .me{display:block;margin-top:auto;padding:12px;font-size:13px;color:var(--sub)}
  /* 日曆:左邊月曆、右邊(固定在畫面上)當天內容 */
  #p-cal.on{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(330px,1fr);gap:0 28px;align-items:start}
  .cal-top{grid-column:1/-1}
  .cal-side{position:sticky;top:20px;max-height:calc(100vh - 40px);overflow-y:auto;padding-right:2px}
  .cal-side .dhd{margin-top:0}
  .cell{min-height:104px}
  #p-hist,#p-add,#p-set{max-width:720px}
}

/* ===== 視覺優化:柔和色票、線條圖示、統一強調色 ===== */
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:22px;font-weight:700;letter-spacing:.2px;margin:4px 0 14px}
.card,.stat,.cell{box-shadow:var(--shadow)}
.card{border-radius:16px}
button{background:var(--pri-solid);color:#fff;font-weight:600;transition:filter .15s,transform .05s}
button:active{transform:scale(.98);filter:brightness(.92)}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500}
button.del{background:transparent;color:var(--danger)}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--pri-solid);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri-solid) 28%,transparent)}
.chip{color:var(--chip-text);font-weight:600}
.stat b{color:var(--pri);font-weight:700}
.seg button.on{background:var(--pri-solid);border-color:var(--pri-solid);color:#fff}
.cell{border-radius:12px}
.cell.out{opacity:.35}
.cell.has{background:color-mix(in srgb,var(--pri-solid) var(--tint),var(--card))}
.cell.today .n{background:var(--pri-solid);color:#fff}
.cell.sel{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.dot{width:8px;height:8px}
.pos,.pv b{color:var(--pri)}
dialog::backdrop{background:rgba(0,0,0,.55)}
/* 底部導覽:線條圖示,選中有藥丸底色 */
.tabs{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs .ic{display:flex;align-items:center;justify-content:center}
.tabs .ic svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--pri)}
@media(max-width:899px){
  .tabs button{gap:3px}
  .tabs .ic{padding:4px 18px;border-radius:999px;transition:background .15s}
  .tabs button.on .ic{background:color-mix(in srgb,var(--pri-solid) 20%,transparent)}
}
@media(min-width:900px){.tabs .ic svg{width:20px;height:20px}}
.swatches{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 2px}
.swi{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
.sw{width:40px;height:40px;border-radius:50%;padding:0;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw.on{box-shadow:0 0 0 2.5px var(--pri)}
/* ===== Wordle 統計 ===== */
.wdash .card{break-inside:avoid;margin-bottom:12px}
.ct{font-weight:700;font-size:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ct .meta{font-weight:400}
.h2h{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:12px 0 6px;background:var(--line)}
.h2h i{display:block;height:100%}
.h2hl{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.fmrow{display:flex;align-items:center;gap:8px;margin:8px 0}
.fms{display:flex;gap:4px;flex-wrap:wrap}
.fm{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--line)}
.fm.s1,.fm.s2,.fm.s3{background:var(--ok)}
.fm.s4{background:#bda43d}
.fm.s5,.fm.s6{background:#c98234}
.fm.x{background:var(--danger)}
.fm.na{color:var(--sub)}
.fms10{flex:1;display:grid;grid-template-columns:repeat(10,1fr);gap:3px;min-width:0}
.fms10 .fm{width:auto;aspect-ratio:1;height:auto;border-radius:6px;font-size:11px}
.fmrow .chip{min-width:64px;text-align:center}
.stat .chip{color:var(--chip-text);margin:0;font-size:11px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats4 .stat{box-shadow:none;background:var(--bg)}
.cmpsel{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.cmpsel select{margin:0;flex:1}
.cmp{width:100%;border-collapse:collapse;font-size:14px}
.cmp th{font-size:12px;color:var(--sub);font-weight:500;text-align:right;padding:0 0 6px}
.cmp td{padding:6px 0;text-align:right;border-top:1px solid var(--line)}
.cmp td:first-child,.cmp th:first-child{text-align:left}
.cmp tr.pl td{border-top:0;padding-top:14px;text-align:left}
.cmp .good{color:var(--ok);font-weight:700}
.cmp .bad{color:var(--danger);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.drow{display:flex;align-items:center;gap:6px;margin:4px 0}
.drow>.dn{width:12px;font-size:12px;color:var(--sub);text-align:center}
.dbar{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.dbar i{display:block;height:18px;border-radius:5px}
.dbar b{font-size:12px;font-weight:600;color:var(--sub)}
.wk{width:100%;border-collapse:collapse;text-align:center;font-size:13px}
.wk th{font-size:12px;color:var(--sub);font-weight:500;padding-bottom:4px}
.wk td{padding:6px 0}
.wk .best{color:var(--pri);font-weight:700}
.hi{padding:8px 0;border-top:1px solid var(--line)}
.hi:first-of-type{border-top:0}
.hw{font-weight:700;letter-spacing:1px;margin-right:8px}
@media(min-width:900px){
  .wdash{column-count:2;column-gap:12px}
  .hfilter{margin:0 -32px;padding:6px 32px 8px}
}
/* ===== 單字區 ===== */
.hfilter{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -16px 10px;padding:6px 16px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips:empty{display:none}
.chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--card);color:var(--sub);border:1px solid var(--line);padding:6px 12px;font-size:13px;font-weight:500;border-radius:999px}
.fchip i{width:8px;height:8px;border-radius:50%;display:block}
.fchip.on{background:color-mix(in srgb,var(--pri-solid) 18%,var(--card));color:var(--pri);border-color:color-mix(in srgb,var(--pri-solid) 55%,var(--line))}
.fsep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.hbar{display:flex;gap:8px;align-items:center;margin-top:8px}
.hbar .seg{margin:0;flex:1}
.hbar .seg button{padding:7px 0}
.hbar select{width:auto;margin:0;padding:8px 8px;font-size:14px}
.hbar>button{padding:8px 12px;font-size:14px}
.wd-card .word{font-size:22px;letter-spacing:.2px;line-height:1.25}
.wline{display:flex;align-items:center}
.wsub{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:2px}
.wsub .lv,.wsub .chip{margin:0}
.spk{width:34px;height:34px;padding:0;margin-left:8px;border-radius:50%;background:color-mix(in srgb,var(--pri-solid) 16%,transparent);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;flex:none}
.spk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.pos{background:color-mix(in srgb,var(--pri-solid) 16%,transparent);border-radius:6px;padding:1px 7px;font-size:12px}
.pv{display:flex;align-items:baseline;gap:2px;line-height:1.7}
.mon>summary{display:flex;justify-content:space-between;align-items:center}
.mon>summary .meta{font-weight:400}
.lrow{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;box-shadow:var(--shadow)}
.lrow>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:12px 14px;margin:0;color:var(--text);font-size:15px}
.lrow>summary::-webkit-details-marker{display:none}
.lrow>summary::after{content:'›';color:var(--sub);font-size:18px;line-height:1;transition:transform .15s}
.lrow[open]>summary::after{transform:rotate(90deg)}
.lw{font-weight:700;font-size:17px}
.lrow .lv{margin:0}
.lz{flex:1;min-width:0;color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.lbody{padding:8px 14px 12px;border-top:1px solid var(--line)}
.lbody .sec:first-of-type{border-top:0;margin-top:4px}

/* ===== v8:單字卡 / Wordle 排版重整 ===== */
.cg{display:grid;gap:12px}
.cg>.card,.cg>.lrow{margin-bottom:0}
#list.v-list .cg{gap:8px}
.wc-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.wc-main{min-width:0;flex:1}
.wc-act{display:flex;align-items:center;gap:4px;flex:none}
.wc-act .spk{margin:0}
.wd-card .word{overflow-wrap:anywhere}
.phon{color:var(--sub);font-size:14px;margin-top:2px;letter-spacing:.2px}
.wtags{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.wtags .lv,.wtags .chip{margin:0}
.dtag{font-size:12px;color:var(--sub);background:var(--bg);border-radius:6px;padding:0 7px}
.pvs{margin-top:10px}
.pv{display:flex;align-items:baseline;gap:8px;margin:5px 0}
.pv .pos{flex:none;margin:0;min-width:2.6em;text-align:center}
.pz{flex:1;min-width:0}
.more-d{margin-top:10px;border-top:1px solid var(--line)}
.more-d>summary{list-style:none;display:flex;justify-content:center;align-items:center;gap:4px;margin:0;padding:10px 0 2px;color:var(--pri);font-size:13px;font-weight:600}
.more-d>summary::-webkit-details-marker{display:none}
.more-d>summary::after{content:'›';display:inline-block;font-size:17px;line-height:1;transform:rotate(90deg);transition:transform .15s}
.more-d[open]>summary::after{transform:rotate(-90deg)}
.more-d .t2,.more-d[open] .t1{display:none}
.more-d[open] .t2{display:inline}
.more-d>summary+.sec{border-top:0;margin-top:6px}
.sense{margin:8px 0 10px}
.sz{display:flex;align-items:baseline;gap:8px}
.sn{flex:none;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--pri-solid) 16%,transparent);color:var(--pri);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;transform:translateY(-1px)}
.sen{margin:2px 0 0 26px}
.ex{background:none;border-left:3px solid color-mix(in srgb,var(--pri-solid) 40%,transparent);border-radius:0;padding:2px 0 2px 10px;margin:6px 0 0 26px;line-height:1.5}
.xr{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;margin:6px 0;font-size:14px}
.xk{color:var(--sub);font-size:12px;padding-top:2px}
.xv{min-width:0;overflow-wrap:anywhere}
.tg{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:0 9px;margin:0 6px 4px 0;font-size:13px}
.aif{margin-top:8px;font-size:12px}
.wcard .wno{padding-top:6px}
.wcard .tiles{margin:8px 0 4px}
.wcard .scs{margin-top:8px;gap:8px 16px}
.scs>span{display:inline-flex;align-items:center}

/* Wordle 統計 */
.wdash{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;column-count:auto}
.wdash>.card{margin:0}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vsp{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.vsp.lead{border-color:color-mix(in srgb,var(--pri-solid) 55%,var(--line));background:color-mix(in srgb,var(--pri-solid) 9%,var(--card))}
.vsp .chip{margin:0}
.vsn{margin:10px 0 12px;line-height:1}
.vsn b{font-size:36px;font-weight:800}
.vsn span{font-size:13px;color:var(--sub);margin-left:4px}
.vsm{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;border-top:1px solid var(--line);padding-top:8px}
.vsm b{display:block;font-size:15px}
.vsm span{font-size:11px;color:var(--sub)}
.h2h{margin-top:14px}
.fmrow .chip{min-width:80px;flex:none}
.fms10{grid-template-columns:repeat(10,minmax(0,38px))}
.fms10 .fm{max-height:38px}
.two.stk>div+div{border-top:1px solid var(--line);margin-top:8px;padding-top:12px}
.lgd{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--sub)}
.lgd span{display:inline-flex;align-items:center;gap:5px}
.lgd .fm{width:12px;height:12px;border-radius:4px}
.stats4{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats4 .stat{padding:10px 6px}
.stats4 .stat span{display:block}
.sd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.two.stk{grid-template-columns:1fr;gap:6px}
@media(min-width:600px){
  .two.stk{grid-template-columns:1fr 1fr;gap:16px}
  .two.stk>div+div{border-top:0;margin-top:0;padding-top:0}
}
@media(min-width:600px) and (max-width:899px){
  .stats4{grid-template-columns:repeat(4,minmax(0,1fr))}
}
@media(min-width:900px){
  .wdash{grid-template-columns:repeat(2,minmax(0,1fr));column-count:auto}
  .wdash>.wide{grid-column:1/-1}
  #p-hist{max-width:none}
  #list.v-list{max-width:760px}
  #list.v-card .cg,#w-list.cg{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
}
.hbar select{max-width:42%}

/* ===== 內建 Wordle 遊戲 ===== */
:root{--abs:#8a90a0}
:root[data-theme="dark"]{--abs:#3b404c}
.gwrap{max-width:420px;margin:0 auto}
.gmsg{min-height:26px;text-align:center;font-weight:700;font-size:15px;margin:2px 0 8px;color:var(--sub)}
.gmsg.win{color:var(--ok)}
.gboard{display:grid;gap:5px;max-width:290px;margin:0 auto 12px}
.grow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.gt{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;text-transform:uppercase;background:var(--card);color:var(--text)}
.gt.f{border-color:var(--sub);animation:gpop .12s}
.gt.c{--tb:var(--ok);background:var(--ok);border-color:var(--ok);color:#fff}
.gt.p{--tb:#bda43d;background:#bda43d;border-color:#bda43d;color:#fff}
.gt.a{--tb:var(--abs);background:var(--abs);border-color:var(--abs);color:#fff}
.gt.rv{animation:gflip .6s ease-in-out both}
.gt.bn{animation:gbounce .7s ease both}
.grow.shk{animation:gshake .4s}
@keyframes gflip{
  0%{transform:rotateX(0);background:var(--card);border-color:var(--sub);color:var(--text)}
  49.9%{transform:rotateX(90deg);background:var(--card);border-color:var(--sub);color:var(--text)}
  50%{transform:rotateX(90deg);background:var(--tb);border-color:var(--tb);color:#fff}
  100%{transform:rotateX(0);background:var(--tb);border-color:var(--tb);color:#fff}}
@keyframes gbounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}60%{transform:translateY(2px)}80%{transform:translateY(-4px)}}
@keyframes gpop{50%{transform:scale(1.1)}}
@keyframes gshake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.gact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 0 12px}
.gact:empty{display:none}
.gkb{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.gkr{display:flex;gap:5px;justify-content:center}
.gk{flex:1;max-width:42px;height:48px;padding:0;border-radius:8px;background:var(--line);color:var(--text);font-size:15px;font-weight:700;text-transform:uppercase}
.gk.w{flex:1.5;max-width:64px;font-size:16px}
.gk.c{background:var(--ok);color:#fff}
.gk.p{background:#bda43d;color:#fff}
.gk.a{background:var(--abs);color:#fff;opacity:.6}
@media(max-width:380px){.gboard{max-width:250px}.gk{height:44px}}

/* 身分 / 對戰 / 回放 / 詳細數據 */
.gwho{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:14px}
.gwho .chip{margin:0 2px}
.gwho button{padding:6px 14px}
.gvs{margin-bottom:12px}
.vsr{display:flex;align-items:center;gap:10px;margin:8px 0}
.vsr .chip{margin:0;min-width:72px;text-align:center}
.vsr b{font-size:17px}
.vsv{text-align:center;font-weight:700;margin-top:10px}
.rhd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.rhd button{padding:6px 12px}
.rpg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rpc{min-width:0}
.rph{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:8px;font-size:14px}
.rph .chip{margin:0}
.rb{max-width:none;margin:0 0 8px;gap:3px}
.rb .grow{gap:3px}
.rb .gt{font-size:16px;border-radius:4px;border-width:1.5px}
.rpt{width:100%;border-collapse:collapse;font-size:12px;text-align:center}
.rpt td{padding:3px 0;border-top:1px solid var(--line)}
.rctl{margin-top:12px}
.rctl input[type=range]{padding:0;border:0;background:none;margin:0 0 8px;box-shadow:none}
.rbt{display:flex;gap:6px;justify-content:center;margin-bottom:6px}
.rbt button{padding:9px 14px}
.rbtn{width:100%;margin-top:10px}
.vsg{display:flex;gap:16px;justify-content:center;margin:10px 0 4px}
.vsg>div{text-align:center}.vsg .chip{margin:0 0 6px}
.mg{display:grid;gap:2px;justify-content:center}.mgr{display:flex;gap:2px}
.mt{width:13px;height:13px;border-radius:2px;display:block;background:var(--abs)}
.mt.c{background:var(--ok)}.mt.p{background:#bda43d}
.rpt th{font-weight:600;color:var(--sub);padding:2px 0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px;margin:6px 0}
.kv>span{color:var(--sub);font-size:13px;white-space:nowrap}
.kv b{white-space:nowrap}
.vsp.tl{text-align:left}
.vsp.tl .chip{margin-bottom:6px}
@media(max-width:420px){.rpg{gap:8px}.rb .gt{font-size:14px}.rpt{font-size:11px}}

/* ===== 日曆:電腦版放大、單字當主角 ===== */
.cell .wsc{display:none}
@media(min-width:600px){
  .cell .w{font-size:12.5px;font-weight:600;padding:1px 4px}
  .cell .w.wd{font-size:15px;font-weight:800;letter-spacing:.07em;text-align:center;padding:4px 2px;border:0;border-radius:7px;
    background:color-mix(in srgb,var(--ok) 26%,transparent);color:var(--text)}
  .cell .w.wd.lock{font-size:11.5px;font-weight:600;letter-spacing:0;background:var(--line);color:var(--sub)}
  .cell .wsc{display:flex;justify-content:center;gap:8px;font-size:11px;font-weight:700;line-height:1.2}
  .cell .n{font-size:12px}
}
@media(min-width:900px){
  #p-cal.on{grid-template-columns:minmax(0,2.4fr) minmax(300px,1fr);gap:0 24px}
  .cell{min-height:118px;padding:6px 7px;gap:4px}
  .cell .w.wd{font-size:clamp(15px,1.5vw,19px)}
  .cell .w{font-size:13px}
  .grid{gap:6px}
}
@media(min-width:1280px){ .wrap{max-width:1280px} }

/* 回填勾選區 */
#g-bf{margin:12px auto 0;max-width:420px;width:100%}
.gbf{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left}
.gbf input[type=checkbox]{flex:none;width:20px!important;height:20px;min-width:20px;margin:1px 0 0;padding:0;accent-color:var(--pri-solid,var(--pri))}
.gbf .gbt{flex:1;min-width:0;font-size:13px;line-height:1.5;color:var(--text);word-break:normal}
.gbf .gbt small{display:block;margin-top:2px;font-size:12px;color:var(--sub)}
/* 日曆(電腦版):右側當天內容更寬,月曆稍微縮小 */
@media(min-width:900px){
  #p-cal.on{grid-template-columns:minmax(0,1.45fr) minmax(420px,1fr);gap:0 24px}
  .cell{min-height:104px;padding:5px 6px}
  .cell .w.wd{font-size:clamp(13px,1.15vw,16px)}
  .grid{gap:5px}
  .cal-side{padding-right:4px}
}
@media(min-width:1280px){ .wrap{max-width:1360px} }

/* 日期查詢欄 */
.qdate{margin:0!important;width:auto!important;flex:none;min-width:0;max-width:150px;padding:9px 8px}
/* ===== Wordle 遊戲畫面排序 ===== */
.gwrap{display:flex;flex-direction:column}
.gl,.gc,.gr{display:contents}
#g-who{order:1}#g-mode{order:2}#g-info{order:3}#g-board{order:4}#g-msg{order:5}#g-kb{order:6}#g-act{order:7}#g-vs{order:8}#g-bf{order:9}#g-stat{order:10}
#g-info{text-align:center;margin:4px 0 8px;line-height:1.6;font-size:13px;color:var(--sub)}
#g-info:empty{display:none}
#g-bf:empty{display:none}
#g-vs{margin-top:4px}
@media(min-width:900px){
  .gwrap{max-width:1120px;display:grid;grid-template-columns:minmax(230px,1fr) 400px minmax(270px,1fr);gap:32px;align-items:start;margin:0 auto}
  .gl,.gc,.gr{display:flex;flex-direction:column;min-width:0}
  .gl{position:sticky;top:20px}
  .gl .gwho{justify-content:flex-start;margin-bottom:12px}
  .gl .seg{flex-direction:column;gap:6px;margin-bottom:14px}
  .gl .seg button{width:100%;text-align:left;padding:10px 14px}
  #g-info{text-align:left;margin:0 0 14px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px;font-size:13.5px}
  #g-bf{max-width:none;margin:0}
  .gc .gboard{max-width:340px;width:100%}
  .gc .gkb{width:100%;max-width:400px;margin:0 auto 16px}   /* flex 欄位裡 margin:auto 會讓寬度縮成內容大小 → 一定要明確給 width */
  .gc .gkr{width:100%}
  .gc .gk{max-width:none;height:52px}
  .gc .gmsg{margin:8px 0 10px}
  .gc .gact{width:100%}
  .gr .gvs{margin:0 0 14px}
}

/* 輸出秒數勾選 / 猜過的字 */
.rtm{display:flex;align-items:center;gap:8px;font-size:13px;margin:0 0 8px;cursor:pointer}
.rtm input{width:18px!important;height:18px;min-width:18px;flex:none;margin:0;padding:0}
.wschip{display:inline-flex;gap:6px;align-items:baseline;padding:5px 11px;margin:0 6px 6px 0;border-radius:999px;font-size:13px;width:auto}
.wschip b{letter-spacing:.04em}.wschip i{font-style:normal;font-size:11px;font-weight:700}
.gw{cursor:pointer;border-bottom:1px dotted var(--sub)}

/* 離線待上傳提示 */
#oq-bar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:60;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13px;box-shadow:0 4px 18px rgba(0,0,0,.18);cursor:pointer;max-width:92vw;text-align:center}
</style>

<body>
<div class="wrap">
<div class="card err" id="ver" style="display:none;font-size:14px">⚠️ 後端(Code.gs)還是舊版:Wordle 會跟每日單字混在同一張表。請貼上新的 Code.gs,再「部署 → 管理部署作業 → 編輯 → 新版本」。</div>

<!-- 日曆(首頁) -->
<section class="pane on" id="p-cal">
  <div class="cal-top">
  <h1>日曆</h1>
  <div class="seg" id="c-mode">
    <button data-m="all">都顯示</button>
    <button data-m="words">每日單字</button>
    <button data-m="wordle">Wordle</button>
  </div>
  <div class="stats" id="stats"></div>
  </div>
  <div class="cal-main">
  <div class="cal-hd">
    <button class="ghost" id="c-prev">‹</button>
    <div class="t" id="c-title"></div>
    <button class="ghost" id="c-today">今天</button>
    <button class="ghost" id="c-next">›</button>
  </div>
  <div class="grid" id="dow"></div>
  <div class="grid" id="grid" style="margin-top:4px"></div>
  </div>
  <div class="cal-side">
  <div class="dhd">
    <b id="d-title"></b>
    <span class="dact">
      <button class="ghost editmode">✎ 編輯</button>
      <button id="d-addw">＋ Wordle</button>
      <button id="d-add">＋ 單字</button>
    </span>
  </div>
  <div id="d-list"></div>
  </div>
</section>

<!-- 紀錄 -->
<section class="pane" id="p-hist">
  <h1>單字 <span class="meta" id="count"></span></h1>
  <div class="stats" id="h-stats"></div>
  <div class="hfilter">
    <div class="row" style="gap:8px"><input id="q" placeholder="🔍 搜尋單字 / 中文 / 日期(如 2026-10)" style="margin:0"><input type="date" id="q-d" class="qdate" title="依日期查詢" aria-label="依日期查詢"><button class="ghost" id="q-dx" aria-label="清除日期" style="display:none">✕</button><button class="ghost" id="refresh" aria-label="重新整理">🔄</button></div>
    <div class="chips" id="h-chips"></div>
    <div class="hbar">
      <div class="seg" id="h-view"><button data-v="card">卡片</button><button data-v="list">列表</button></div>
      <select id="h-sort" aria-label="排序"><option value="new">新 → 舊</option><option value="old">舊 → 新</option><option value="az">A → Z</option></select>
      <button class="ghost editmode">✎ 編輯</button>
    </div>
  </div>
  <div id="list"></div>
</section>

<!-- Wordle(統計 + 紀錄) -->
<section class="pane" id="p-wd">
  <h1>Wordle <span class="meta" id="w-count"></span></h1>
  <div class="row" style="margin-bottom:10px">
    <div class="seg" id="w-view" style="flex:1;margin:0"><button data-v="dash">📊 統計</button><button data-v="list">📜 紀錄</button><button data-v="game">🎮 遊玩</button></div>
    <button class="ghost" id="w-refresh" aria-label="重新整理">🔄</button>
  </div>
  <div id="w-dash-wrap"><div class="wdash" id="w-dash"></div></div>
  <div id="w-game-wrap" style="display:none">
    <div class="gwrap">
      <!-- 手機:依遊玩順序單欄排列(身分 → 模式 → 本題資訊 → 盤面 → 訊息 → 鍵盤 → 操作 → 對戰 → 回填 → 統計) ; 電腦:左欄設定 / 中欄遊戲 / 右欄結果與統計 -->
      <div class="gl">
        <div class="gwho" id="g-who"></div>
        <div class="seg" id="g-mode"><button data-g="daily">今日 NYT</button><button data-g="rand">隨機練習</button><button data-g="rec">重玩紀錄字</button></div>
        <div id="g-info"></div>
        <div id="g-bf"></div>
      </div>
      <div class="gc">
        <div class="gboard" id="g-board"></div>
        <div class="gmsg" id="g-msg"></div>
        <div class="gkb" id="g-kb"></div>
        <div class="gact" id="g-act"></div>
      </div>
      <div class="gr">
        <div class="card gvs" id="g-vs" style="display:none"></div>
        <div class="card gstat" id="g-stat"></div>
      </div>
    </div>
  </div>
  <div id="w-list-wrap" style="display:none">
    <div class="row" style="margin-bottom:10px"><input id="w-q" placeholder="🔍 答案 / 日期(如 2026-10)/ 期數" style="margin:0"><input type="date" id="w-qd" class="qdate" title="依日期查詢" aria-label="依日期查詢"><button class="ghost" id="w-qdx" aria-label="清除日期" style="display:none">✕</button><button class="ghost editmode">✎ 編輯</button></div>
    <div id="w-list" class="cg"></div>
  </div>
</section>

<!-- 新增(單字 / Wordle 共用入口) -->
<section class="pane" id="p-add">
  <h1>新增</h1>
  <div class="seg" id="a-mode"><button data-a="word">單字</button><button data-a="wordle">Wordle</button></div>

  <div id="a-word">
    <div class="card">
      <div class="meta" id="who" style="margin-bottom:8px"></div>
      <div class="meta">日期(預設今天;同一天可以新增多個單字)</div>
      <input id="date" type="date">
      <div class="row">
        <div style="width:104px"><input id="day" type="number" min="1"></div>
        <input id="word" placeholder="今天的單字" autocapitalize="none" autocomplete="off">
      </div>
      <input id="note" placeholder="備註 / 語境(選填,例如原句,AI 會參考)">
      <button id="add" style="width:100%">✨ 加入並用 AI 解釋</button>
      <div class="msg" id="msg" style="margin-top:8px"></div>
    </div>
    <div id="latest"></div>
  </div>

  <div id="a-wordle" style="display:none">
    <div class="card">
      <div class="meta">日期(同一天只會有一筆,再次儲存會覆蓋)</div>
      <input id="w-date" type="date">
      <div class="row">
        <div style="width:104px"><input id="w-no" type="number" placeholder="期數"></div>
        <input id="w-word" maxlength="5" placeholder="答案(5 個字母)" autocapitalize="none" autocomplete="off">
      </div>
      <div class="row" id="w-scores" style="align-items:flex-start"></div>
      <input id="w-note" placeholder="備註(選填)">
      <button id="w-add" style="width:100%">儲存</button>
      <div class="msg" id="w-msg" style="margin-top:8px"></div>
    </div>

</section>

  <div class="me" id="me"></div>

<script>
const $=id=>document.getElementById(id);
const get=(k,d='')=>localStorage.getItem('dw_'+k)||d;
/* ★★★ 管理者只需改這兩行(一次性)★★★ */
const API_URL='https://script.google.com/macros/s/AKfycbz6QSOXfuZ9kWz-EaZehQm8UsCW1frJ0VZeedLpMxFTutexgn9q-VrCE2kZUMIdF6kG/exec';
const TOKEN='roxykilo';
const cfg=()=>({user:['Roxy','Kuanlee'].includes(get('user'))?get('user'):'',url:API_URL.startsWith('https://')?API_URL:'',token:TOKEN});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
/* 「今天」一律以台北時間(Asia/Taipei)為準:每天 00:00 換題,不受裝置時區影響 */
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

/* 日期一律整理成 yyyy-mm-dd(修正試算表把日期轉成 UTC 時間的問題) */
const fmtDate=d=>{
  if(!d) return '';
  const s=String(d);
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const t=new Date(s); if(isNaN(t)) return s;
  return new Date(t.getTime()+8*3600e3).toISOString().slice(0,10); // 台北時間
};
const fixRows=a=>(a||[]).map(r=>({...r,date:fmtDate(r.date)}));

let rows=fixRows(JSON.parse(localStorage.getItem('dw_cache')||'[]'));
let editMode=false,dayTouched=false;
const BASE=['id','day','word','user','date','note','pending'];

window.onThemeChange=()=>{try{render();renderW();renderCal()}catch(e){}};
function color(name){let h=0;for(const c of name)h=(h*31+c.charCodeAt(0))%360;return document.documentElement.dataset.theme==='dark'?`hsl(${h} 58% 70%)`:`hsl(${h} 52% 46%)`}

/* ---------- 分頁 ---------- */
function tab(t){
  window.scrollTo(0,0);
  document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  if(t==='hist'||t==='cal'||t==='add') load();
  if(t==='wd'||t==='cal'||t==='add') loadW();
}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));

/* ---------- 設定 ---------- */
function paintAppearance(){
  const mode=localStorage.getItem('dw_theme')||'auto',acc=localStorage.getItem('dw_accent')||'indigo';
  document.querySelectorAll('#s-theme button').forEach(b=>b.classList.toggle('on',b.dataset.v===mode));
  const dk=document.documentElement.dataset.theme==='dark';
  $('s-acc').innerHTML=Object.entries(ACCENTS).map(([k,v])=>`<div class="swi"><button class="sw${k===acc?' on':''}" data-k="${k}" aria-label="${v.n}" style="background:${v[dk?'D':'L'][0]}"></button><span>${v.n}</span></div>`).join('');
  document.querySelectorAll('#s-acc .sw').forEach(b=>b.onclick=()=>{localStorage.setItem('dw_accent',b.dataset.k);applyTheme();paintAppearance();onThemeChange()});
}
document.querySelectorAll('#s-theme button').forEach(b=>b.onclick=()=>{localStorage.setItem('dw_theme',b.dataset.v);applyTheme();paintAppearance();onThemeChange()});
function fillSettings(){
  const u=cfg().user;
  $('s-who').innerHTML=['Roxy','Kuanlee'].map(n=>`<button class="${u===n?'':'ghost'}" style="flex:1;padding:12px" onclick="setUser('${n}')">${u===n?'✓ ':''}${n}</button>`).join('');
  paintAppearance();
}
function setUser(n){
  localStorage.setItem('dw_user',n); $('s-msg').textContent='已切換為 '+n+' ✅';
  fillSettings(); refreshWho(); load(); if(typeof renderW==='function') renderW(); if(G.init) gRender(true);
}
function refreshWho(){const c=cfg();$('me').innerHTML=c.user?`👤 <span class="chip" style="background:${color(c.user)}">${esc(c.user)}</span>`:'';$('who').innerHTML=c.user?`目前身分:<span class="chip" style="background:${color(c.user)}">${esc(c.user)}</span>`:'⚠️ 請先到「設定」選擇你是 Roxy 或 Kuanlee';}

/* ---------- 雲端 ---------- */
async function load(){
  const c=cfg(); if(!c.url||!c.token){render();return}
  try{
    const r=await fetch(`${c.url}?token=${encodeURIComponent(c.token)}`);
    const j=await r.json(); if(j.error) throw new Error(j.error);
    checkVer(j);
    rows=fixRows(j.rows); localStorage.setItem('dw_cache',JSON.stringify(rows));
    $('count').textContent='';
  }catch(e){ $('count').textContent='(離線/讀取失敗:'+e.message+')'; }
  render();
}
function checkVer(j){ $('ver').style.display=(j&&j.v>=2)?'none':'block'; }   // 後端沒更新到新版就顯示警告
async function post(body){
  const c=cfg();
  const r=await fetch(c.url,{method:'POST',body:JSON.stringify({token:c.token,...body})}); // 不設 header,避免 CORS 預檢
  const j=await r.json(); if(j.error){const e=new Error(j.error);e.j=j;throw e} return j;
}

/* ---------- 離線補寫:沒網路時先存在這台裝置,連線後自動補傳 ----------
   只排隊「可重送」的寫入(Wordle 成績 / 練習統計 / 回填標記);伺服器回報的錯誤(答案不符等)不排隊 */
const oqGet=()=>{try{return JSON.parse(localStorage.getItem('dw_oq'))||[]}catch(e){return []}};
function oqSet(a){localStorage.setItem('dw_oq',JSON.stringify(a)); oqPaint()}
function oqKey(b){return b.action==='wordleSave'?`ws|${b.date}|${b.user}`:b.action==='update'?`up|${b.id}|${Object.keys(b.data||{}).join(',')}`:'q|'+(b.qid||Date.now()+Math.random())}
function oqPush(b){const k=oqKey(b); oqSet(oqGet().filter(x=>x.k!==k).concat({k,body:b,ts:Date.now()}))}
async function postQ(body){
  try{ return await post(body) }
  catch(e){ if(e.j) throw e; oqPush(body); return {ok:true,queued:true} }   // 沒有伺服器回應 = 網路問題 → 排隊
}
let OQBUSY=false;
async function flushQ(){
  const q=oqGet(); if(OQBUSY||!q.length||!cfg().url) return; OQBUSY=true; let done=0;
  try{
    for(const it of q){
      try{ await post(it.body); oqSet(oqGet().filter(x=>x.k!==it.k)); done++ }
      catch(e){ if(e.j){ oqSet(oqGet().filter(x=>x.k!==it.k)); console.warn('補傳被伺服器拒絕',e.message) } else break }
    }
  }finally{ OQBUSY=false }
  if(done){ await loadW(); loadPS().then(()=>{ if(G.init) gRender(true) }) }
}
function oqPaint(){
  let el=$('oq-bar'); if(!el){el=document.createElement('div');el.id='oq-bar';el.onclick=flushQ;document.body.appendChild(el)}
  const n=oqGet().length; el.style.display=n?'':'none';
  el.textContent=`📡 ${n} 筆待上傳${navigator.onLine?' · 點一下立即補傳':' · 離線中,連線後自動補傳'}`;
}
window.addEventListener('online',()=>{oqPaint();flushQ()}); window.addEventListener('offline',oqPaint);
setInterval(flushQ,60000);

/* ---------- AI(由 Apps Script 後端處理,金鑰不在網頁裡) ---------- */
async function aiLookup(word,note){
  try{
    const j=await post({action:'lookup',word,note,user:cfg().user});
    return j.data;
  }catch(e){
    if(e.message==='not_a_word'){
      const sg=e.j&&e.j.suggestion;
      const x=new Error('找不到這個單字'+(sg?`,你是不是要找「${sg}」?`:''));x.notWord=true;throw x;
    }
    throw e;
  }
}

/* ---------- 新增 ---------- */
const nextDay=()=>rows.length?Math.max(...rows.map(r=>+r.day||0))+1:1;
function suggestDay(){
  if(dayTouched) return;
  const d=$('date').value||today(), same=rows.filter(r=>r.date===d);
  $('day').value=same.length?same[0].day:nextDay();
}
$('day').oninput=()=>{dayTouched=true};
$('date').onchange=()=>{dayTouched=false;suggestDay()};
$('date').value=today();

function toggleEdit(){
  editMode=!editMode;
  document.querySelectorAll('.editmode').forEach(b=>{b.textContent=editMode?'✅ 完成':'✎ 編輯';b.style.color=editMode?'var(--pri)':''});
  render();
  renderW();
}
document.querySelectorAll('.editmode').forEach(b=>b.onclick=toggleEdit);

$('add').onclick=async()=>{
  const c=cfg(),w=$('word').value.trim();
  if(!c.user) return msg('請先到「設定」選擇你是 Roxy 或 Kuanlee',1);
  if(!c.url) return msg('管理者尚未在 index.html 最上方填入 API_URL',1);
  if(!w) return msg('請輸入單字',1);
  $('add').disabled=true; msg('查詢字典並請 AI 整理中…');
  const row={id:Date.now(),day:parseInt($('day').value)||nextDay(),word:w,user:c.user,date:$('date').value||today(),note:$('note').value.trim(),data:{}};
  try{ const d=await aiLookup(w,row.note); row.word=d.word||w; row.data=d; }
  catch(e){
    if(e.notWord){ msg(e.message,1); $('add').disabled=false; return; }
    row.data={pending:true}; msg(e.message+'(先存單字,之後可重試)',1);
  }
  try{
    await post({action:'add',row});
    rows.unshift({...row.data,...row,data:undefined});
    localStorage.setItem('dw_cache',JSON.stringify(rows));
    if(!row.data.pending) msg('已加入共用單字本 ✅');
    $('latest').innerHTML=card(rows[0]); $('word').value='';$('note').value='';
    dayTouched=false; suggestDay(); $('word').focus(); renderCal();
  }catch(e){ msg('寫入雲端失敗:'+e.message,1) }
  $('add').disabled=false;
};
$('word').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});
function msg(t,err){$('msg').textContent=t;$('msg').className='msg'+(err?' err':'')}

/* ---------- 重試 / 刪除 ---------- */
async function retry(id){
  const r=rows.find(x=>String(x.id)===String(id)); if(!r) return;
  try{ const d=await aiLookup(r.word,r.note); await post({action:'update',id,word:d.word||r.word,data:d}); load(); }
  catch(e){ alert(e.message) }
}
async function del(id){
  if(!confirm('刪除這個單字?')) return;
  try{ await post({action:'delete',id,user:cfg().user}); load(); }catch(e){ alert('無法刪除:'+e.message) }
}

/* ---------- 編輯(兩人都能改) ---------- */
let editing=null;
function edit(id){
  const r=rows.find(x=>String(x.id)===String(id)); if(!r) return;
  editing=r;
  $('e-date').value=r.date||'';$('e-day').value=r.day||'';$('e-word').value=r.word||'';$('e-note').value=r.note||'';
  const data={...r}; BASE.forEach(k=>delete data[k]);
  $('e-json').value=JSON.stringify(data,null,2);
  $('e-msg').textContent=''; $('dlg').showModal();
}
$('e-cancel').onclick=()=>$('dlg').close();
$('e-ai').onclick=async()=>{
  $('e-msg').textContent='查詢字典並請 AI 整理中…';
  try{
    const d=await aiLookup($('e-word').value.trim(),$('e-note').value.trim());
    if(d.word) $('e-word').value=d.word;
    $('e-json').value=JSON.stringify(d,null,2);
    $('e-msg').textContent='已填入新內容,記得按儲存';
  }catch(e){$('e-msg').textContent=e.message}
};
$('e-save').onclick=async()=>{
  let data;
  try{ data=JSON.parse($('e-json').value||'{}'); }catch(_){ return $('e-msg').textContent='詞條內容的 JSON 格式有誤'; }
  delete data.pending;
  $('e-msg').textContent='儲存中…';
  try{
    await post({action:'update',id:editing.id,day:parseInt($('e-day').value)||editing.day,date:$('e-date').value||editing.date,word:$('e-word').value.trim(),note:$('e-note').value.trim(),data});
    $('dlg').close(); load();
  }catch(e){$('e-msg').textContent=e.message}
};

/* ---------- 發音 ---------- */
function tts(w){const u=new SpeechSynthesisUtterance(w);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}
function speak(w,a){ if(a){ new Audio(a).play().catch(()=>tts(w)); } else tts(w); }

/* ---------- 顯示 ---------- */
function preview(w){
  if(w.meanings&&w.meanings.length){
    return w.meanings.slice(0,3).map(m=>`<div class="pv"><span class="pos">${esc(m.pos)}</span><span class="pz">${esc((m.senses||[]).slice(0,2).map(s=>s.zh).join(';'))}</span></div>`).join('');
  }
  return w.zh?`<div class="pv"><span class="pos">${esc(w.pos||'')}</span><span class="pz">${esc(w.zh)}</span></div>`:'';  // 舊資料
}
const xr=(k,v)=>`<div class="xr"><span class="xk">${k}</span><div class="xv">${v}</div></div>`;
const tgs=a=>a.map(x=>`<span class="tg">${esc(x)}</span>`).join('');
function full(w){
  let h='';
  if(w.meanings&&w.meanings.length){
    h+=w.meanings.map(m=>`<div class="sec"><span class="pos">${esc(m.pos)}</span>`+
      (m.senses||[]).map((s,i)=>`<div class="sense"><div class="sz"><span class="sn">${i+1}</span><b>${esc(s.zh)}</b></div>${s.en?`<div class="meta sen">${esc(s.en)}</div>`:''}`+
        (s.examples||[]).map(e=>`<div class="ex">${esc(e.en)}<br><span class="meta">${esc(e.zh)}</span></div>`).join('')+`</div>`).join('')+`</div>`).join('');
  }else if(w.zh){   // 舊資料
    h+=`<div class="sec"><div class="meta">${esc(w.definition||'')}</div><div class="ex">${esc(w.example)}<br><span class="meta">${esc(w.exampleZh)}</span></div></div>`;
  }
  let x='';
  if(w.forms) x+=xr('詞形',esc(w.forms));
  if((w.phrases||[]).length) x+=xr('片語',w.phrases.map(p=>`<div>${esc(p.en)} <span class="meta">— ${esc(p.zh)}</span></div>`).join(''));
  if((w.synonyms||[]).length) x+=xr('同義',tgs(w.synonyms));
  if((w.antonyms||[]).length) x+=xr('反義',tgs(w.antonyms));
  if(w.tip) x+=xr('提示',esc(w.tip));
  if(w.note) x+=xr('備註',esc(w.note));
  h+=`<div class="sec">${x}<div class="meta aif">🤖 AI by ${esc(w.aiBy||'?')} · ${esc(fmtDate(w.date))}</div></div>`;
  return h;
}
const SPK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
const spk=w=>`<button class="spk" aria-label="發音" onclick="speak(this.dataset.w,this.dataset.a)" data-w="${esc(w.word)}" data-a="${esc(w.audio||'')}">${SPK}</button>`;
const editBtns=w=>editMode?`<div style="white-space:nowrap"><button class="del" style="color:var(--sub)" onclick="edit('${w.id}')">✎</button><button class="del" onclick="del('${w.id}')">✕</button></div>`:'';
function card(w){
  return `<div class="card wd-card">
    <div class="wc-hd">
      <div class="wc-main"><div class="word">${esc(w.word)}</div>${w.phonetic?`<div class="phon">${esc(w.phonetic)}</div>`:''}</div>
      <div class="wc-act">${spk(w)}${editBtns(w)}</div>
    </div>
    <div class="wtags">${w.level?`<span class="lv">${esc(w.level)}</span>`:''}<span class="chip" style="background:${color(w.user||'?')}">${esc(w.user)}</span>${w.day?`<span class="dtag">Day ${esc(w.day)}</span>`:''}</div>
    ${w.pending?`<div class="msg err" style="margin-top:8px">尚未取得 AI 解釋 <button onclick="retry('${w.id}')">用我的 AI 重試</button></div>`:
    `<div class="pvs">${preview(w)}</div><details class="more-d"><summary><span class="t1">展開完整解釋</span><span class="t2">收合</span></summary>${full(w)}</details>`}
  </div>`;
}
function lrow(w){
  const m=(w.meanings&&w.meanings[0]);
  const first=m?`${m.pos||''} ${(m.senses||[]).slice(0,2).map(x=>x.zh).join(';')}`:(w.zh||(w.pending?'尚未取得解釋':''));
  return `<details class="lrow"><summary><span class="lw">${esc(w.word)}</span>${w.level?`<span class="lv">${esc(w.level)}</span>`:''}<span class="lz">${esc(first)}</span></summary>
    <div class="lbody"><div class="hd" style="align-items:center"><div class="meta wsub">${spk(w)}${w.phonetic?`<span>${esc(w.phonetic)}</span>`:''}<span class="chip" style="background:${color(w.user||'?')}">${esc(w.user)}</span>${w.day?`<span>Day ${esc(w.day)}</span>`:''}</div>${editBtns(w)}</div>
    ${w.pending?`<div class="msg err">尚未取得 AI 解釋 <button onclick="retry('${w.id}')">用我的 AI 重試</button></div>`:full(w)}</div></details>`;
}

/* ---------- 日曆 ---------- */
let calY,calM,selDate,calMode=get('calmode','all');
if(!['all','words','wordle'].includes(calMode)) calMode='all';
function initCal(){const t=today();calY=+t.slice(0,4);calM=+t.slice(5,7)-1;selDate=t}
const WD=['日','一','二','三','四','五','六'];
$('dow').innerHTML=[...WD.slice(1),WD[0]].map(d=>`<div class="dow">${d}</div>`).join('');   // 週一為每週第一天

function renderCal(){
  const showW=calMode!=='words', showD=calMode!=='wordle';   // 依選擇顯示 Wordle / 每日單字 / 都顯示
  const byDate={},wByDate={};
  if(showD) rows.forEach(r=>(byDate[r.date]??=[]).push(r));
  if(showW) wrows.forEach(r=>(wByDate[r.date]??=[]).push(r));
  const has=k=>!!(byDate[k]||wByDate[k]);
  const all=[...(showD?rows:[]),...(showW?wrows:[])];
  const LB=calMode==='wordle'?'Wordle':calMode==='words'?'單字':'紀錄';

  // 統計
  const mk=`${calY}-${pad(calM+1)}`;
  const mRows=all.filter(r=>String(r.date).startsWith(mk));
  const mDays=new Set(mRows.map(r=>r.date)).size;
  let streak=0;const d=new Date();d.setHours(12,0,0,0);
  if(!has(dkey(d))) d.setDate(d.getDate()-1);   // 今天還沒記,從昨天算起
  while(has(dkey(d))){streak++;d.setDate(d.getDate()-1)}
  $('stats').innerHTML=[[mRows.length,'本月'+LB],[mDays,'本月天數'],[streak,'連續天數'],[all.length,'累計'+LB]]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

  // 月曆格
  $('c-title').textContent=`${calY} 年 ${calM+1} 月`;
  const first=new Date(calY,calM,1),off=(first.getDay()+6)%7;   // 週一 = 0
  const dim=new Date(calY,calM+1,0).getDate();
  const total=Math.ceil((off+dim)/7)*7, t=today();
  let h='';
  for(let i=0;i<total;i++){
    const dt=new Date(calY,calM,1-off+i),k=dkey(dt),ws=[...(wByDate[k]||[]).map(r=>({w:1,r})),...(byDate[k]||[]).map(r=>({w:0,r}))];   // Wordle 排最上面
    const cls=['cell'];
    if(dt.getMonth()!==calM) cls.push('out');
    if(ws.length) cls.push('has');
    if(k===t) cls.push('today');
    if(k===selDate) cls.push('sel');
    h+=`<div class="${cls.join(' ')}" data-d="${k}"><div class="n">${dt.getDate()}</div>`+
      ws.slice(0,3).map(x=>x.w?(wSpoil(x.r)
        ?`<div class="w wd lock" title="打完今天的挑戰才會揭曉">🔒 待揭曉</div>`
        :`<div class="w wd" title="Wordle #${esc(x.r.day)}">${esc(String(x.r.word).toUpperCase())}</div>`)
        +`<div class="wsc">${WP.map(p=>{const v=wScore(x.r,p);return v===''?'':`<span style="color:${color(p)}">${esc(p[0])}${v==='X'?'✕':v}</span>`}).join('')}</div>`
        :`<div class="w" style="border-color:${color(x.r.user||'?')}">${esc(x.r.word)}</div>`).join('')+
      (ws.length>3?`<div class="more">+${ws.length-3}</div>`:'')+
      (ws.length?`<div class="dots">${ws.slice(0,6).map(x=>x.w?'<span class="dot wd"></span>':`<span class="dot" style="background:${color(x.r.user||'?')}"></span>`).join('')}</div>`:'')+`</div>`;
  }
  $('grid').innerHTML=h;

  // 選取日的單字
  const sd=new Date(selDate+'T12:00:00');
  const dl=(byDate[selDate]||[]).slice().sort((a,b)=>a.id-b.id);
  const wl=(wByDate[selDate]||[]).slice().sort((a,b)=>a.id-b.id);
  const cnt=[showW?`${wl.length} 個 Wordle`:'',showD?`${dl.length} 個單字`:''].filter(Boolean).join(' · ');
  $('d-title').textContent=`${sd.getMonth()+1} 月 ${sd.getDate()} 日(週${WD[sd.getDay()]})· ${cnt}`;
  $('d-list').innerHTML=(wl.length||dl.length)?wl.map(wcard).join('')+dl.map(card).join(''):'<p class="meta" style="text-align:center;margin:20px 0">這天沒有紀錄</p>';   // Wordle 在上
  $('d-addw').style.display=showW?'':'none'; $('d-add').style.display=showD?'':'none';
  document.querySelectorAll('#c-mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===calMode));
}
function pickDate(k){selDate=k;calY=+k.slice(0,4);calM=+k.slice(5,7)-1;renderCal()}
function moveMonth(n){
  const d=new Date(calY,calM+n,1);calY=d.getFullYear();calM=d.getMonth();
  const t=today();
  selDate=(t.slice(0,7)===`${calY}-${pad(calM+1)}`)?t:`${calY}-${pad(calM+1)}-01`;
  renderCal();
}
$('grid').onclick=e=>{const c=e.target.closest('.cell');if(c)pickDate(c.dataset.d)};
document.querySelectorAll('#c-mode button').forEach(b=>b.onclick=()=>{calMode=b.dataset.m;localStorage.setItem('dw_calmode',calMode);renderCal()});
$('d-addw').onclick=()=>{tab('add');addMode('wordle');$('w-date').value=selDate;wFill();$('w-word').focus()};
$('c-prev').onclick=()=>moveMonth(-1);
$('c-next').onclick=()=>moveMonth(1);
$('c-today').onclick=()=>{initCal();renderCal()};
$('d-add').onclick=()=>{$('date').value=selDate;dayTouched=false;suggestDay();tab('add');addMode('word');$('word').focus()};

/* ---------- 紀錄(依月份收合) ---------- */
let hUser='',hLevel='',hSort=get('hsort','new'),hView=get('hview','card');
if(!['new','old','az'].includes(hSort)) hSort='new';
if(!['card','list'].includes(hView)) hView='card';
const LV=['A1','A2','B1','B2','C1','C2'];
const lvIdx=l=>LV.indexOf(l)<0?9:LV.indexOf(l);
const WK='日一二三四五六';
const wkOf=d=>/^\d{4}-\d{2}-\d{2}$/.test(d)?WK[new Date(d+'T00:00:00').getDay()]:'';
function hStats(){
  const t=today(), m=t.slice(0,7), days=new Set(rows.map(r=>r.date));
  let cur=0,d=new Date(); if(!days.has(dkey(d))) d.setDate(d.getDate()-1);
  while(days.has(dkey(d))){cur++; d.setDate(d.getDate()-1)}
  return [[rows.length,'總單字'],[rows.filter(r=>String(r.date).slice(0,7)===m).length,'本月新增'],[rows.filter(r=>r.date===t).length,'今日'],[cur,'連續天數']]
    .map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
}
function hChips(){
  const us=[...new Set(rows.map(r=>r.user).filter(Boolean))].sort();
  const lv=[...new Set(rows.map(r=>r.level).filter(Boolean))].sort((a,b)=>lvIdx(a)-lvIdx(b)||a.localeCompare(b));
  let h='';
  if(us.length>1) h+=`<button class="fchip${hUser?'':' on'}" onclick="setH('user','')">全部</button>`
    +us.map(u=>`<button class="fchip${hUser===u?' on':''}" data-v="${esc(u)}" onclick="setH('user',hUser===this.dataset.v?'':this.dataset.v)"><i style="background:${color(u)}"></i>${esc(u)}</button>`).join('');
  if(lv.length){ if(h) h+='<span class="fsep"></span>';
    h+=lv.map(l=>`<button class="fchip${hLevel===l?' on':''}" data-v="${esc(l)}" onclick="setH('level',hLevel===this.dataset.v?'':this.dataset.v)">${esc(l)}</button>`).join('') }
  return h;
}
function setH(k,v){ if(k==='user') hUser=v; else hLevel=v; render(); }
function render(){
  const q=$('q').value.trim().toLowerCase();
  const qd=$('q-d').value; $('q-dx').style.display=qd?'':'none';
  const list=rows.filter(r=>(!q||JSON.stringify(r).toLowerCase().includes(q))&&(!qd||r.date===qd)&&(!hUser||r.user===hUser)&&(!hLevel||r.level===hLevel));
  $('count').textContent=$('count').textContent.startsWith('(離線')?$('count').textContent:`(${list.length}${list.length!==rows.length?' / '+rows.length:''})`;
  $('h-stats').innerHTML=hStats(); $('h-chips').innerHTML=hChips();
  document.querySelectorAll('#h-view button').forEach(b=>b.classList.toggle('on',b.dataset.v===hView));
  $('h-sort').value=hSort;
  const one=hView==='list'?lrow:card, filtered=!!(q||qd||hUser||hLevel);
  let html='';
  if(hSort==='az'){
    const sorted=[...list].sort((a,b)=>String(a.word).toLowerCase().localeCompare(String(b.word).toLowerCase()));
    const byL={}; sorted.forEach(r=>(byL[(String(r.word)[0]||'#').toUpperCase()]??=[]).push(r));
    html=Object.keys(byL).sort().map(L=>`<div class="day">${esc(L)} <span class="meta">${byL[L].length}</span></div><div class="cg">${byL[L].map(one).join('')}</div>`).join('');
  }else{
    const k=hSort==='old'?-1:1;
    list.sort((a,b)=>k*((b.day-a.day)||(String(b.date).localeCompare(String(a.date)))||(b.id-a.id)));
    const byM={};list.forEach(r=>(byM[String(r.date).slice(0,7)]??=[]).push(r));
    html=Object.keys(byM).sort().reverse().map(m=>m).sort((a,b)=>k*b.localeCompare(a)).map((m,idx)=>{
      const arr=byM[m],byDay={};arr.forEach(r=>(byDay[r.day]??=[]).push(r));
      const inner=Object.keys(byDay).sort((a,b)=>k*(b-a)).map(d=>{
        const dt=byDay[d][0].date, wk=wkOf(dt);
        return `<div class="day">Day ${esc(d)} · ${esc(dt)}${wk?`(週${wk})`:''}</div><div class="cg">${byDay[d].map(one).join('')}</div>`}).join('');
      const label=/^\d{4}-\d{2}$/.test(m)?`${m.slice(0,4)} 年 ${+m.slice(5)} 月`:'其他';
      return `<details class="mon" ${(idx===0||filtered)?'open':''}><summary>${label}<span class="meta">${arr.length} 個單字</span></summary>${inner}</details>`;
    }).join('');
  }
  $('list').className='v-'+hView;
  $('list').innerHTML=html||`<p class="meta" style="text-align:center;margin-top:24px">${filtered?(qd?'這天('+qd+')沒有單字紀錄':'沒有符合條件的單字'):'還沒有單字,到「新增」頁加入第一個吧'}</p>`;
  suggestDay();
  renderCal();
}
$('h-sort').onchange=e=>{hSort=e.target.value;localStorage.setItem('dw_hsort',hSort);render()};
document.querySelectorAll('#h-view button').forEach(b=>b.onclick=()=>{hView=b.dataset.v;localStorage.setItem('dw_hview',hView);render()});
$('q').oninput=render; $('refresh').onclick=load;
$('q-d').onchange=render; $('q-dx').onclick=()=>{$('q-d').value='';render()};

/* ---------- Wordle ----------
   資料存在試算表的 wordle 工作表:
   word = 答案、day = Wordle 期數、note = 備註、
   data = { scores: { Roxy: "3", Kuanlee: "X" }, ...AI 詞條 }
   分數:"1"~"6" = 猜幾次猜中,"X" = 失敗,沒有 = 還沒填 */
const WP=['Roxy','Kuanlee'];
let wrows=fixRows(JSON.parse(localStorage.getItem('dw_wcache')||'[]'));
const wNo=d=>Math.floor((Date.UTC(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10))-Date.UTC(2021,5,19))/864e5); // Wordle #0 = 2021-06-19(例:2024-03-15 = #1000)
const wScore=(r,p)=>{const s=(r.scores||{})[p];return (s===undefined||s===null)?'':String(s)};
const wRank=(r,p)=>{const s=wScore(r,p);return s===''?null:(s==='X'?7:+s)};   // 越小越好,失敗 = 7
/* 你還沒完成今天的挑戰,而對方已經記錄 → 隱藏今天的答案(避免在列表/日曆/統計被劇透) */
function wSpoil(r){
  if(r.date!==today()) return false;
  const me=gMe(); if(!me) return true;
  if(wScore(r,me)!=='') return false;                                  // 我已有成績(含手動補登)→ 公開
  return !(G.mode==='daily'&&G.over&&G.date===r.date&&G.player===me);   // 我剛打完每日挑戰、還沒上傳 → 也公開
}
const wData=r=>{const d={...r};BASE.forEach(k=>delete d[k]);return d};        // 取出 data 欄內容
function wWin(r){
  const a=wRank(r,WP[0]),b=wRank(r,WP[1]);
  if(a===null||b===null) return null;                 // 有人還沒填 → 不算對戰
  return a<b?WP[0]:(b<a?WP[1]:'tie');
}

const WOPT='<option value="">未填</option>'+[1,2,3,4,5,6].map(n=>`<option value="${n}">${n} 次</option>`).join('')+'<option value="X">失敗 ✕</option>';
$('w-scores').innerHTML=WP.map(p=>`<div style="flex:1;min-width:0"><div class="meta" style="margin-bottom:4px"><span class="chip" style="background:${color(p)}">${p}</span>猜幾次?</div><select id="w-s-${p}">${WOPT}</select></div>`).join('');

function wmsg(t,err){$('w-msg').textContent=t;$('w-msg').className='msg'+(err?' err':'')}

/* 依日期把表單填好:這天已有紀錄就帶入,沒有就清空 */
let wLatest='';
let wBase={day:'',note:'',scores:{}};   // 表單填入當下的內容;儲存時只送出「和這份不同」的欄位
function wFill(quiet){
  const date=$('w-date').value||today(), ex=wrows.find(r=>r.date===date);
  $('w-no').value=ex?ex.day:wNo(date);
  $('w-word').value=ex?ex.word:'';
  $('w-note').value=ex?(ex.note||''):'';
  WP.forEach(p=>$('w-s-'+p).value=ex?wScore(ex,p):'');
  wBase={day:ex?String(ex.day):'',note:ex?(ex.note||''):'',scores:Object.fromEntries(WP.map(p=>[p,ex?wScore(ex,p):'']))};
  if(!quiet) wmsg(ex?'這天已有紀錄,只會更新你改過的欄位,不會蓋掉對方的':'');
}
$('w-date').onchange=()=>wFill();
$('w-date').value=today(); wFill(true);

async function loadW(){
  const c=cfg(); if(!c.url){renderW();return}
  try{
    const r=await fetch(`${c.url}?token=${encodeURIComponent(c.token)}&sheet=wordle`);
    const j=await r.json(); if(j.error) throw new Error(j.error);
    checkVer(j);
    wrows=fixRows(j.rows); localStorage.setItem('dw_wcache',JSON.stringify(wrows));
    if($('w-msg').className.includes('err')) wmsg('');
  }catch(e){ wmsg('讀取失敗:'+e.message,1); }
  renderW();
  if(!$('w-word').value.trim()) wFill(true);   // 表單是空的才帶入,不會蓋掉正在輸入的內容
}

$('w-add').onclick=async()=>{
  const c=cfg(),w=$('w-word').value.trim().toLowerCase(),date=$('w-date').value||today();
  if(!c.user) return wmsg('請先到「設定」選擇你是 Roxy 或 Kuanlee',1);
  if(!c.url) return wmsg('管理者尚未在 index.html 最上方填入 API_URL',1);
  if(w&&!/^[a-z]{5}$/.test(w)) return wmsg('Wordle 答案要剛好 5 個英文字母',1);
  if(!w&&!wrows.find(r=>r.date===date)) return wmsg('這天還沒有答案,請先填入答案',1);
  // 只送出「你改過」的欄位,由伺服器依日期合併 → 不會蓋掉對方剛填的答案 / 分數 / 備註
  const body={sheet:'wordle',action:'wordleSave',id:Date.now(),date,user:c.user,scores:{}};
  if(w) body.word=w;
  WP.forEach(p=>{const v=$('w-s-'+p).value; if(v!==wBase.scores[p]) body.scores[p]=v});
  const dayV=$('w-no').value.trim(), note=$('w-note').value.trim();
  if(dayV!==wBase.day) body.day=parseInt(dayV)||wNo(date);
  if(note!==wBase.note) body.note=note;
  $('w-add').disabled=true; wmsg('儲存中…');
  try{
    const j=await post(body);
    await loadW(); wFill(true); wLatest=date; renderW();
    wmsg(j.created?'已加入 ✅':'已儲存(只更新你改過的欄位)✅');
    await wAuto(date);   // 這天還沒有單字解釋 → 自動產生
  }catch(e){ wmsg(e.message==='need_word'?'這天還沒有答案,請先填入答案':e.message==='not found'?'後端還是舊版,請重新部署 Code.gs':'寫入失敗:'+e.message,1) }
  $('w-add').disabled=false;
};
$('w-word').addEventListener('keydown',e=>{if(e.key==='Enter')$('w-add').click()});

/* 儲存後,若這天的答案還沒有 AI 解釋 → 自動查詢並存起來(已有就不再查,不浪費額度) */
async function wAuto(date){
  const r=wrows.find(x=>x.date===date);
  if(!r||(r.meanings&&r.meanings.length)) return;
  wmsg('已儲存 ✅,正在產生單字意思…');
  try{
    const d=await aiLookup(r.word,'');
    await post({sheet:'wordle',action:'update',id:r.id,merge:true,data:d});
    await loadW();
    wmsg('已儲存,並產生單字意思 ✅');
  }catch(e){ wmsg('已儲存 ✅,但 AI 查詢失敗('+e.message+'),可在卡片上按「🤖 查意思」重試',1) }
}
/* 重置「我自己」某天的成績:兩次確認,只清自己的分數與逐步紀錄,不動對方、不動答案 */
async function wreset(date){
  const me=gMe(), c=cfg(); if(!me) return alert('請先到「設定」選你是 Roxy 或 Kuanlee');
  if(!c.url) return alert('尚未設定 API_URL');
  const r=wrows.find(x=>x.date===date); if(!r) return alert('找不到這天的紀錄');
  if(!confirm(`【第 1 次確認】要重置 ${date} 你(${me})的成績與逐步紀錄嗎?\n\n只會清掉你自己的,對方的成績和答案不受影響。`)) return;
  if(!confirm(`【第 2 次確認】${date} 的成績刪除後無法復原。\n\n確定要刪除嗎?`)) return;
  try{
    await post({sheet:'wordle',action:'wordleSave',id:Date.now(),date,user:me,scores:{[me]:''}});
    await post({sheet:'wordle',action:'update',id:r.id,merge:true,data:{['g_'+me]:null}});
    try{const l=JSON.parse(localStorage.getItem(gLocKey())); if(l&&l.date===date) localStorage.removeItem(gLocKey())}catch(e){}
    await loadW(); wFill(true); renderW();
    if(G.date===date&&G.mode==='daily') gStart();
  }catch(e){ alert('重置失敗:'+e.message) }
}
async function wdel(id){
  if(!confirm('刪除這筆 Wordle 紀錄?')) return;
  try{ await post({sheet:'wordle',action:'delete',id}); loadW(); }catch(e){ alert('無法刪除:'+e.message) }
}
function wedit(id){
  const r=wrows.find(x=>String(x.id)===String(id)); if(!r) return;
  tab('add');addMode('wordle');
  $('w-date').value=r.date; wFill();
  window.scrollTo({top:0,behavior:'smooth'});
}
async function wlookup(id){
  const r=wrows.find(x=>String(x.id)===String(id)); if(!r) return;
  try{
    const d=await aiLookup(r.word,'');
    await post({sheet:'wordle',action:'update',id,merge:true,data:d});   // merge:伺服器保留現有分數
    loadW();
  }catch(e){ alert(e.message) }
}

function wbadge(r,p,win){
  const s=wScore(r,p);
  const cls=s===''?'na':(s==='X'?'bad':'ok');
  const txt=s===''?'—':(s==='X'?'失敗':`${s}/6`);
  return `<span><span class="chip" style="background:${color(p)}">${esc(p)}</span><span class="sc ${cls}${win?' win':''}">${txt}</span>${win?' 🏆':''}</span>`;
}
function wcard(w){
  if(wSpoil(w)) return `<div class="card wcard"><div class="wc-hd"><div class="meta wno">Wordle #${esc(w.day)} · ${esc(w.date)}</div></div>
    <div class="tiles">${'<div class="tile">?</div>'.repeat(5)}</div>
    <div class="scs">${WP.map(p=>wbadge(w,p,false)).join('')}</div>
    <div class="meta" style="margin-top:6px">🔒 打完今天的挑戰才會顯示答案</div></div>`;
  const has=w.meanings&&w.meanings.length, win=wWin(w);
  return `<div class="card wcard">
    <div class="wc-hd">
      <div class="meta wno">Wordle #${esc(w.day)} · ${esc(w.date)}</div>
      <div class="wc-act">${spk(w)}${editMode?`<div style="white-space:nowrap">${gMe()&&(wScore(w,gMe())!==''||wPlay(w,gMe()))?`<button class="del" style="color:var(--sub)" title="重置我的成績" onclick="wreset('${w.date}')">↺</button>`:''}<button class="del" style="color:var(--sub)" onclick="wedit('${w.id}')">✎</button><button class="del" onclick="wdel('${w.id}')">✕</button></div>`:''}</div>
    </div>
    <div class="tiles">${[...String(w.word)].map(ch=>`<div class="tile">${esc(ch)}</div>`).join('')}</div>
    ${w.phonetic?`<div class="phon">${esc(w.phonetic)}</div>`:''}
    <div class="scs">${WP.map(p=>wbadge(w,p,win===p)).join('')}${win==='tie'?'<span class="meta">🤝 平手</span>':''}</div>
    ${w.note?`<div class="meta" style="margin-top:6px">📝 ${esc(w.note)}</div>`:''}

function wQuality(){
  const T={}; WP.forEach(p=>T[p]={n:0,a1:[],lr:[],waste:0,open:{}});
  wrows.forEach(r=>{ if(wSpoil(r)) return; const ans=String(r.word).toLowerCase();
    WP.forEach(p=>{const pl=wPlay(r,p); if(!pl||!pl.g.length) return; const rem=wRemain(pl,ans), o=T[p]; o.n++;
      o.a1.push(rem[0]); (o.open[pl.g[0]]=o.open[pl.g[0]]||[]).push(rem[0]);
      rem.forEach((v,i)=>{ const prev=i?rem[i-1]:GALL.length; if(prev<=1||(i===rem.length-1&&pl.g[i]===ans)) return;   // 已確定答案 / 最後一步猜中不算
        if(v===prev) o.waste++; o.lr.push(Math.log(Math.max(v,1)/prev)) }) }) });
  if(!WP.some(p=>T[p].n)) return '';
  const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
  const row=(l,v)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:13px"><span class="meta">${l}</span><b>${v}</b></div>`;
  const col=p=>{const o=T[p]; if(!o.n) return `<div style="flex:1">${chip(p)}<p class="meta">還沒有逐步紀錄</p></div>`;
    const ops=Object.entries(o.open).map(([w,a])=>({w,n:a.length,m:mean(a)})).sort((a,b)=>(b.n>1)-(a.n>1)||a.m-b.m).slice(0,3);
    return `<div style="flex:1;min-width:0">${chip(p)}<div style="margin-top:6px">`
      +row('統計局數',o.n)+row('第 1 步後平均剩',Math.round(mean(o.a1))+' 字')+row('平均每步淘汰',o.lr.length?Math.round((1-Math.exp(mean(o.lr)))*100)+'%':'–')+row('沒縮小範圍的猜測',o.waste+' 次')
      +`<div class="meta" style="margin-top:6px">開局表現(第 1 步後平均剩餘,越少越好)</div>`+ops.map(x=>`<div style="font-size:13px;padding:2px 0"><b>${x.w.toUpperCase()}</b> <span class="meta">×${x.n} → 剩 ${Math.round(x.m)}</span></div>`).join('')+'</div></div>'};
  return `<div class="card wide"><div class="ct">猜字品質<span class="meta">每步猜完還剩幾個可能的字</span></div><div style="display:flex;gap:18px">${WP.map(col).join('')}</div>
    <div class="meta" style="margin-top:8px">以官方可猜字表(約 ${GALL.length} 字)為基準,不是答案池,所以絕對數字偏大,拿來互相比較。「沒縮小範圍」= 這一步猜完,可能的字數完全沒變少。結果頁的逐步表格也有「剩餘」欄。</div></div>`;
}
function wStepTime(){
  const acc={}; WP.forEach(p=>acc[p]=Array.from({length:6},()=>[]));
  wrows.forEach(r=>{ if(wSpoil(r)) return; WP.forEach(p=>{const pl=wPlay(r,p); if(!pl||pl.bf||!pl.t||!pl.t.length) return;
    pl.t.forEach((t,i)=>{ if(i>5) return; const d=i?t-pl.t[i-1]:t; if(d>=0&&d<=600) acc[p][i].push(d) }) })});
  if(!WP.some(p=>acc[p].some(a=>a.length))) return '';
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const mx=Math.max(...WP.flatMap(p=>acc[p].map(a=>avg(a)||0)),1);
  const col=p=>`<div style="flex:1;min-width:0">${chip(p)}<div style="margin-top:6px">`+acc[p].map((a,i)=>{const v=avg(a);
    return `<div class="drow"><span class="dn">${i+1}</span><div class="dbar"><i style="width:${v?Math.max(v/mx*100,6):0}%;background:${color(p)}"></i><b>${v===null?'–':fmtT(v)}<small style="font-weight:400;opacity:.6"> ×${a.length}</small></b></div></div>`}).join('')+'</div></div>';
  return `<div class="card wide"><div class="ct">每步驟平均耗時<span class="meta">第幾次猜 · 不含回填</span></div><div style="display:flex;gap:18px">${WP.map(col).join('')}</div><div class="meta" style="margin-top:6px">×N = 樣本數;第 1 步包含看題與想開局的時間</div></div>`;
}
/* ---------- 猜過的字:輔助單字資料(只含已揭曉的日子,今天沒打完不會列入 → 不會洩漏答案) ---------- */
let WS={q:'',all:false};
function wGuessed(){
  const m={};
  wrows.forEach(r=>{ if(wSpoil(r)) return; const a=String(r.word).toLowerCase();
    WP.forEach(p=>{const pl=wPlay(r,p); if(!pl) return; pl.g.forEach(g=>{
      const e=m[g]=m[g]||{w:g,n:{},last:'',ans:false}; e.n[p]=(e.n[p]||0)+1; if(r.date>e.last) e.last=r.date; if(g===a) e.ans=true})})});
  return Object.values(m);
}
function wsList(){
  const q=WS.q.trim().toLowerCase(), cnt=e=>WP.reduce((t,p)=>t+(e.n[p]||0),0);
  let l=wGuessed().filter(e=>!q||e.w.includes(q)).sort((a,b)=>cnt(b)-cnt(a)||(a.last<b.last?1:-1));
  const tot=l.length; if(!WS.all) l=l.slice(0,40);
  return l.map(e=>`<button class="ghost wschip" onclick="wsOpen('${e.w}')"><b>${e.w.toUpperCase()}</b>${WP.map(p=>e.n[p]?`<i style="color:${color(p)}">${esc(p[0])}${e.n[p]}</i>`:'').join('')}${e.ans?'<i>✔</i>':''}</button>`).join('')
    +(tot>l.length?`<button class="ghost wschip" onclick="WS.all=true;wsFilter()">顯示全部 ${tot} 個</button>`:'')||'<span class="meta">沒有符合的字</span>';
}
const wsFilter=()=>{const e=$('ws-list'); if(e) e.innerHTML=wsList()};
function wGuessCard(){
  const n=wGuessed().length; if(!n) return '';
  return `<div class="card wide"><div class="ct">猜過的字<span class="meta">${n} 個 · 點字看解釋(輔助資料)</span></div>
    <input id="ws-q" placeholder="🔍 搜尋猜過的字" value="${esc(WS.q)}" oninput="WS.q=this.value;WS.all=false;wsFilter()" style="margin:0 0 10px"><div id="ws-list">${wsList()}</div>
    <div class="meta" style="margin-top:6px">字母後面是各人猜過的次數(R / K),✔ = 曾是答案。只列已揭曉的日子。</div></div>`;
}
let WSTOK=0;
async function wsOpen(w){
  const tok=++WSTOK; $('ws-t').textContent=w.toUpperCase(); $('ws-b').innerHTML='<p class="meta">查詢中…</p>'; $('ws-ctl').innerHTML=''; if(!$('wsdlg').open) $('wsdlg').showModal();
  const saved=(typeof rows!=='undefined'?rows:[]).find(r=>String(r.word).toLowerCase()===w);
  let h='';
  try{
    const res=await fetch('https://api.dictionaryapi.dev/v2/entries/en/'+encodeURIComponent(w)), j=await res.json();
    if(Array.isArray(j)&&j.length){
      const ph=(j.find(e=>e.phonetic)||{}).phonetic||'';
      h=(ph?`<div class="meta" style="margin-bottom:6px">${esc(ph)}</div>`:'')+j.flatMap(e=>e.meanings||[]).slice(0,4).map(m=>`<div style="margin:6px 0"><span class="pos">${esc(m.partOfSpeech)}</span> ${(m.definitions||[]).slice(0,2).map(d=>esc(d.definition)).join(' ; ')}</div>`).join('');
    } else h='<p class="meta">字典裡沒有這個字的解釋</p>';
  }catch(e){ h='<p class="meta">暫時查不到解釋(需要網路)</p>' }
  if(tok!==WSTOK) return;
  $('ws-b').innerHTML=(saved?`<div class="meta" style="margin-bottom:6px">📚 已在單字本(${esc(saved.user||'')} · ${esc(saved.date||'')})</div>`:'')+h;
  $('ws-ctl').innerHTML=`<div class="rbt"><button class="ghost" onclick="speak('${w}','')">🔊 發音</button>${saved?'':`<button onclick="wsAdd('${w}')">＋ 加入單字本</button>`}</div>`;
}
function wsAdd(w){
  $('wsdlg').close(); if($('rdlg').open) $('rdlg').close();
  tab('add'); const b=document.querySelector('#a-mode [data-a=word]'); if(b) b.click();
  $('word').value=w; $('note').value='Wordle 猜過的字'; $('word').focus();
}
/* ---------- 月度回顧圖(PNG,固定淺色配色,不含任何答案) ---------- */
let RC={m:''};
function wRecapCard(){
  const ms=wMonths(); if(!ms.length) return '';
  const m=RC.m&&ms.includes(RC.m)?RC.m:ms[ms.length-1];
  return `<div class="card wide"><div class="ct">月度回顧圖<span class="meta">一鍵產生可分享的 PNG</span></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <select id="rc-m" onchange="RC.m=this.value" style="width:auto;margin:0">${ms.slice().reverse().map(x=>`<option value="${x}" ${x===m?'selected':''}>${x}</option>`).join('')}</select>
      <label class="rtm" style="margin:0"><input type="checkbox" ${rpTimeOn()?'checked':''} onchange="localStorage.setItem('dw_img_time',this.checked?'1':'0')"><span>⏱ 附上用時</span></label>
      <button onclick="wRecapImage()" style="flex:1;min-width:140px">📅 下載回顧圖</button></div></div>`;
}
function wRecapImage(){
  const m=($('rc-m')||{}).value||RC.m; if(!m) return;
  const list=wrows.filter(r=>String(r.date).slice(0,7)===m&&!wSpoil(r)&&WP.some(p=>wScore(r,p)));
  if(!list.length) return alert('這個月還沒有成績');
  const c=wCalc(list), showT=rpTimeOn(), W=640, H=showT?640:600, PAD=28, colW=(W-PAD*2-24)/2;
  const st={}; WP.forEach(p=>{const o=c.st[p], ts=list.map(r=>wPlay(r,p)).filter(pl=>pl&&!pl.bf&&pl.t&&pl.t.length).map(pl=>pl.t[pl.t.length-1]);
    st[p]={...o,avg:o.n?(o.sum+7*o.fail)/o.n:null,best:o.dist.findIndex(x=>x>0)+1,tAvg:ts.length?ts.reduce((a,b)=>a+b,0)/ts.length:null,tMin:ts.length?Math.min(...ts):null}});
  const cv=document.createElement('canvas'); cv.width=W*2; cv.height=H*2; const x=cv.getContext('2d'); x.scale(2,2);
  const F=(w,sz)=>`${w} ${sz}px system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  x.fillStyle='#fff'; x.fillRect(0,0,W,H); x.textBaseline='middle'; x.textAlign='center';
  x.fillStyle='#111'; x.font=F(800,28); x.fillText('Wordle 月度回顧',W/2,38);
  x.fillStyle='#777'; x.font=F(500,16); x.fillText(`${m.slice(0,4)} 年 ${+m.slice(5)} 月 · ${c.games} 局`,W/2,68);
  const w0=c.st[WP[0]].win, w1=c.st[WP[1]].win, lead=w0===w1?null:(w0>w1?WP[0]:WP[1]);
  x.fillStyle=lead?color(lead):'#555'; x.font=F(800,20);
  x.fillText(lead?`🏆 ${lead} 本月勝出  ${Math.max(w0,w1)} : ${Math.min(w0,w1)}${c.tie?`(平手 ${c.tie})`:''}`:`🤝 本月平手  ${w0} : ${w1}${c.tie?`(平手 ${c.tie})`:''}`,W/2,106);
  WP.forEach((p,k)=>{
    const o=st[p], ox=PAD+k*(colW+24); let y=140;
    x.textAlign='left'; x.font=F(700,16); const nw=x.measureText(p).width+22;
    x.fillStyle=color(p); x.beginPath(); x.roundRect?x.roundRect(ox,y,nw,28,14):x.rect(ox,y,nw,28); x.fill(); x.fillStyle='#fff'; x.fillText(p,ox+11,y+14); y+=52;
    x.fillStyle='#111'; x.font=F(800,50); x.fillText(o.n?o.avg.toFixed(2):'–',ox,y+10);
    x.fillStyle='#777'; x.font=F(500,13); x.fillText('平均次數(失敗算 7)',ox,y+44); y+=72;
    const lines=[`場數 ${o.n} · 猜中 ${o.ok} · 失敗 ${o.fail}`,`對戰勝 ${o.win} 場`,o.best?`最佳 ${o.best} 次猜中`:'']
      .concat(showT&&o.tAvg!==null?[`平均用時 ${fmtT(o.tAvg)} · 最快 ${fmtT(o.tMin)}`]:[]).filter(Boolean);
    x.fillStyle='#333'; x.font=F(500,14); lines.forEach(t=>{x.fillText(t,ox,y);y+=24}); y+=10;
    const mx=Math.max(...o.dist,1), bw=colW-50;
    o.dist.forEach((n,i)=>{ x.fillStyle='#777'; x.font=F(600,13); x.fillText(i===6?'✕':String(i+1),ox,y+9);
      x.fillStyle=i===6?'#d9534f':color(p); const w=n?Math.max(n/mx*bw,6):0; x.fillRect(ox+18,y,w,18);
      x.fillStyle='#333'; x.fillText(String(n),ox+18+w+6,y+9); y+=24 });
  });
  cv.toBlob(blob=>{const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`wordle-recap-${m}.png`; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),10000)},'image/png');
}
