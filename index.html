localStorage.removeItem('dw_gstat');   // 舊的「這台裝置」統計不再使用
let PS={}, GV={who:'',kind:'daily'};
const gEmpty=()=>({p:0,w:0,cur:0,best:0,d:[0,0,0,0,0,0]});
async function loadPS(){
  const c=cfg(); if(!c.url) return;
  try{
    const j=await (await fetch(`${c.url}?token=${encodeURIComponent(c.token)}&sheet=wstats`)).json();
    if(j&&j.rows){const n={}; j.rows.forEach(r=>{let v=r.practice; if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){v=null}}
      if(WP.includes(r.user)&&v&&Array.isArray(v.d)) n[r.user]=Object.assign(gEmpty(),v)}); PS=n}
  }catch(e){}
}
function gDailyStat(p){
  const st=gEmpty();
  wrows.filter(r=>wScore(r,p)!=='').sort((a,b)=>a.date<b.date?-1:1).forEach(r=>{
    const sc=wScore(r,p); st.p++;
    if(sc==='X') st.cur=0; else {st.w++;st.cur++;st.best=Math.max(st.best,st.cur);st.d[Number(sc)-1]++}
  });
  return st;
}
function gPracticeDone(n,won){
  const me=gMe(), c=cfg(); if(!me||!c.url) return;
  const st=PS[me]=Object.assign(gEmpty(),PS[me]||{}); st.p++;
  if(won){st.w++;st.cur++;st.best=Math.max(st.best,st.cur);st.d[n-1]++} else st.cur=0;
  postQ({sheet:'wstats',action:'practiceSave',user:me,n:won?String(n):'X',qid:'p'+Date.now()+Math.random().toString(36).slice(2,6)}).then(r=>r.queued?null:loadPS()).then(()=>gRender(true)).catch(()=>{});
}
async function gPReset(){
  const me=gMe(); if(!me) return;
  if(!confirm(`【第 1 次確認】要清空 ${me} 的練習統計嗎?(每日挑戰成績不受影響)`)) return;
  if(!confirm('【第 2 次確認】清空後無法復原,確定嗎?')) return;
  try{await post({sheet:'wstats',action:'practiceReset',user:me}); await loadPS(); gRender(true)}catch(e){alert('清空失敗:'+e.message)}
}
function gVset(k,v){GV[k]=v; gRender(true)}
function gStatHtml(){
  const who=GV.who||gMe()||WP[0], kind=GV.kind;
  const st=kind==='daily'?gDailyStat(who):Object.assign(gEmpty(),PS[who]||{}), mx=Math.max(...st.d,1);
  const tg=(k,v,t,cur)=>`<button class="${cur===v?'':'ghost'}" style="padding:4px 12px;font-size:13px" onclick="gVset('${k}','${v}')">${t}</button>`;
  return `<div class="ct">遊玩統計<span class="meta">依人計算 · 同步雲端</span></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">${WP.map(p=>tg('who',p,esc(p),who)).join('')}<span style="flex:1"></span>${tg('kind','daily','每日挑戰',kind)}${tg('kind','practice','練習',kind)}</div>
    <div class="stats4"><div class="stat"><b>${st.p}</b><span>已玩</span></div><div class="stat"><b>${st.p?Math.round(st.w/st.p*100):0}%</b><span>勝率</span></div><div class="stat"><b>${st.cur}</b><span>目前連勝</span></div><div class="stat"><b>${st.best}</b><span>最佳連勝</span></div></div>
    <div style="margin-top:12px">`+st.d.map((n,i)=>`<div class="drow"><span class="dn">${i+1}</span><div class="dbar"><i style="width:${n?Math.max(n/mx*100,7):0}%;background:var(--ok)"></i><b>${n}</b></div></div>`).join('')+`</div>`
    +(kind==='practice'?`<div class="meta" style="margin-top:8px">練習 / 重玩紀錄字才算在這裡;每日挑戰看「每日挑戰」。${who===gMe()?' <a href="#" onclick="gPReset();return false">清空我的練習統計</a>':''}</div>`
      :`<div class="meta" style="margin-top:8px">每日挑戰成績來自 Wordle 紀錄(含手動補登)。</div>`);
}

const fmtT=s=>{if(s===null||s===undefined||isNaN(s))return '–';s=Math.round(s);return Math.floor(s/60)+':'+pad(s%60)};
/* 逐步紀錄存在 Wordle 那天的資料列:g_<名字> = {g:[猜的字], t:[每步累計秒數], a:結束時間} (每人一個欄位,不會互相蓋掉) */
function wPlay(r,p){let v=r['g_'+p]; if(typeof v==='string'){try{v=JSON.parse(v)}catch(e){v=null}} return v&&Array.isArray(v.g)&&v.g.length?v:null}
function gPick(m){
  if(m==='rec'){const l=[...new Set(wrows.map(r=>String(r.word).toLowerCase()).filter(w=>/^[a-z]{5}$/.test(w)))];return l.length?l[Math.floor(Math.random()*l.length)]:''}
  return GWORDS[Math.floor(Math.random()*GWORDS.length)];
}
function gEval(g,a){
  const r=Array(5).fill('a'),cnt={};
  for(let i=0;i<5;i++){ if(g[i]===a[i]) r[i]='c'; else cnt[a[i]]=(cnt[a[i]]||0)+1 }
  for(let i=0;i<5;i++){ if(r[i]==='c') continue; if(cnt[g[i]]>0){r[i]='p';cnt[g[i]]--} }
  return r;
}
/* 取得 NYT 官方當天答案:快取 → 直接抓 NYT → 試算表後端代抓 → 今天已記錄的答案 */
async function gNyt(date){
  const k='dw_nyt_'+date;
  const okj=j=>j&&/^[a-z]{5}$/i.test(String(j.solution||''))&&(!j.print_date||String(j.print_date).slice(0,10)===date);   // print_date 不符 = 拿到別天的題,不採用
  try{const c=JSON.parse(localStorage.getItem(k)); if(c&&c.date===date&&/^[a-z]{5}$/.test(c.solution)) return c}catch(e){}
  const tries=[()=>fetch(`https://www.nytimes.com/svc/wordle/v2/${date}.json`)];
  const c=cfg(); if(c.url) tries.push(()=>fetch(`${c.url}?token=${encodeURIComponent(c.token)}&action=nyt&date=${date}`));
  for(const t of tries){
    try{
      const j=await (await t()).json();
      if(okj(j)){
        const o={solution:String(j.solution).toLowerCase(),day:j.days_since_launch!=null?j.days_since_launch:wNo(date),date};
        Object.keys(localStorage).filter(x=>x.startsWith('dw_nyt_')).forEach(x=>localStorage.removeItem(x));
        localStorage.setItem(k,JSON.stringify(o)); return o;
      }
    }catch(e){}
  }
  const rec=wrows.find(r=>r.date===date&&/^[a-z]{5}$/i.test(String(r.word)));
  return rec?{solution:String(rec.word).toLowerCase(),day:rec.day,date,fromRec:true}:null;
}

function gCheckEnd(silent){

function gKey(k){

    if(!gValid(G.cur)){G.msg='不在字庫中(不計入次數)';G.shake=true;gRender(true);return}   // 不是官方可猜的字:不送出、不計次數、不計時
    G.ts.push(Date.now()-G.t0);

/* 打完自動記錄:先寫分數(只動自己的),再把逐步過程存進 g_<名字> */
async function gSave(){

  if(gMe()!==me){G.msg='⚠ 玩這局的是 '+me+',目前身分已換成 '+(gMe()||'未選')+',沒有上傳(避免記到別人名下)';gRender(true);return}
  if(!c.url){G.msg+=' · 尚未設定 API_URL,沒有上傳';gRender(true);return}
  G.saving=true; gRender(true);
  const date=G.date, n=G.won?String(G.guesses.length):'X';
  try{
    const play=Object.assign({g:G.guesses,t:G.ts.map(x=>Math.round(x/1000)),a:Date.now()},G.backfill?{bf:true}:{});
    const res=await postQ({sheet:'wordle',action:'wordleSave',id:Date.now(),date,user:me,word:G.ans,day:G.day!=null?G.day:wNo(date),verify:true,scores:{[me]:n},play});
    if(res.queued){   // 離線:先存在這台裝置,連線後自動補傳
      G.saved=true; G.saving=false; gSaveLocal(); wLocalApply(date,me,n,play);
      G.msg=(G.msg.split(' · ')[0])+' · 📡 離線,已暫存,連線後自動上傳'; gRender(true); renderW(); return;
    }
    if(!res.play){    // 舊版後端不認得 play → 退回兩步驟
      await loadW();
      const r=wrows.find(x=>x.date===date); if(!r) throw new Error('找不到今天的紀錄');
      await post({sheet:'wordle',action:'update',id:r.id,merge:true,data:{['g_'+me]:play}});
    }
    G.saved=true; G.saving=false; gSaveLocal(); G.msg=G.msg.replace(/ · 已記錄 ✅/,'')+' · 已記錄 ✅'; await loadW(); gRender(true); wAuto(date);
  }catch(e){G.saving=false;

  }).join('');
  const v=rpVerdict(r), canBf=gMe()&&WP.some(p=>p===gMe()&&wPlay(r,p));
  $('r-body').innerHTML=(v?`<div class="vsv" style="margin:0 0 10px">${v}</div>`:'')+`<div class="rpg">${cols}</div>`+(r.note?`<div class="meta" style="margin-top:8px">📝 ${esc(r.note)}</div>`:'')+(canBf?`<div class="meta" style="margin-top:8px">回填只能標記自己的紀錄(${esc(gMe())});回填的局用時不計入統計。</div>`:'');
  $('r-ctl').innerHTML=`<label class="rtm"><input type="checkbox" ${rpTimeOn()?'checked':''} onchange="localStorage.setItem('dw_img_time',this.checked?'1':'0')"><span>⏱ 附上秒數時間(存成圖片 / 複製文字都套用)</span></label><div class="rbt"><button onclick="rpImage()">📷 存成圖片</button><button class="ghost" onclick="rpCopy()">📋 複製文字</button></div><div class="meta" id="r-msg" style="text-align:center"></div>`;
}
/* 文字版結果(emoji 方塊,不含答案,可直接貼給朋友) */
function rpText(r){
  const em={c:'🟩',p:'🟨',a:'⬛'}, ans=String(r.word).toLowerCase();
  return `Wordle #${r.day} · ${r.date}\n`+WP.map(p=>{
    const pl=wPlay(r,p), t=rpTime(pl);
    return `${p} ${rpScore(r,p)}${t!==null&&rpTimeOn()?' ⏱'+fmtT(t):''}`+(pl?'\n'+pl.g.map(g=>gEval(g,ans).map(x=>em[x]).join('')).join('\n'):'');
  }).join('\n\n')+(rpVerdict(r)?'\n\n'+rpVerdict(r):'');
}
function rpCopy(){
  const t=rpText(RP.r), m=x=>{const e=$('r-msg'); if(e) e.textContent=x};
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m('已複製 ✅')).catch(()=>prompt('複製這段文字',t));
}
/* 結果圖:畫成 PNG(固定淺色配色,貼到哪裡都清楚)→ 能分享就分享,否則下載 */
function rpImage(){
  const r=RP.r, ans=String(r.word).toLowerCase(), W=640, T=40, GAP=6, PAD=28, colW=(W-PAD*2-24)/2, showT=rpTimeOn(), TC=showT?38:0;
  const cv=document.createElement('canvas'), H=Math.round(150+6*(((colW-TC-GAP*4)/5)+GAP)+20); cv.width=W*2; cv.height=H*2;
  const x=cv.getContext('2d'); x.scale(2,2);
  const F=(w,sz)=>`${w} ${sz}px system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  const col={c:'#6aaa64',p:'#c9b458',a:'#787c7e'};
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  x.fillStyle='#111';x.textBaseline='middle';x.textAlign='center';
  x.font=F(800,26); x.fillText(`Wordle #${r.day}  ·  ${r.date}`,W/2,34);
  x.font=F(800,20); x.fillStyle='#6aaa64'; x.fillText(ans.toUpperCase(),W/2,66);
  const v=rpVerdict(r); if(v){x.fillStyle='#111';x.font=F(700,18);x.fillText(v,W/2,96)}
  WP.forEach((p,k)=>{
    const pl=wPlay(r,p), t=rpTime(pl), ox=PAD+k*(colW+24), tw=(colW-TC-GAP*4)/5;
    x.textAlign='left'; x.fillStyle=color(p); x.font=F(700,16);
    const nm=p, nw=x.measureText(nm).width+20; x.beginPath(); x.roundRect?x.roundRect(ox,112,nw,26,13):x.rect(ox,112,nw,26); x.fill();
    x.fillStyle='#fff'; x.fillText(nm,ox+10,126);
    x.fillStyle='#111'; x.font=F(800,18); x.fillText(rpScore(r,p)+(win2(r,p)?' 🏆':''),ox+nw+10,126);
    if(showT&&t!==null){x.fillStyle='#777';x.font=F(500,14);x.textAlign='right';x.fillText('⏱ '+fmtT(t),ox+colW,126)}
    else if(showT&&pl&&pl.bf){x.fillStyle='#777';x.font=F(500,14);x.textAlign='right';x.fillText('📝 回填',ox+colW,126)}
    for(let i=0;i<6;i++){const g=pl&&pl.g[i]||'', e=g?gEval(g,ans):null;
      for(let j=0;j<5;j++){const tx=ox+j*(tw+GAP), ty=150+i*(tw+GAP);
        if(e){x.fillStyle=col[e[j]];x.fillRect(tx,ty,tw,tw);x.fillStyle='#fff';x.font=F(800,tw*0.5);x.textAlign='center';x.fillText(g[j].toUpperCase(),tx+tw/2,ty+tw/2+1)}
        else{x.strokeStyle='#d3d6da';x.lineWidth=2;x.strokeRect(tx+1,ty+1,tw-2,tw-2)}}
      if(showT&&pl&&g&&!pl.bf&&pl.t&&pl.t.length){const d=i?pl.t[i]-pl.t[i-1]:pl.t[0]; x.fillStyle='#777';x.font=F(600,12);x.textAlign='left';x.fillText(fmtT(d),ox+5*(tw+GAP)+1,150+i*(tw+GAP)+tw/2)}}
    if(!pl){x.fillStyle='#999';x.font=F(500,14);x.textAlign='center';x.fillText('沒有逐步紀錄',ox+colW/2,150+3*(tw+GAP))}
  });
  function win2(r,p){return wWin(r)===p}
  cv.toBlob(blob=>{
    const m=t=>{const e=$('r-msg'); if(e) e.textContent=t}, name=`wordle-${r.date}-${r.day}.png`;
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.style.display='none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),10000); m('已下載 '+name+' ✅');
  },'image/png');
}

function addMode(m){
  localStorage.setItem('dw_amode',m);
  $('a-word').style.display=m==='word'?'':'none';
  $('a-wordle').style.display=m==='wordle'?'':'none';
  document.querySelectorAll('#a-mode button').forEach(b=>b.classList.toggle('on',b.dataset.a===m));
}
document.querySelectorAll('#a-mode button').forEach(b=>b.onclick=()=>addMode(b.dataset.a));
function setWView(v){
  localStorage.setItem('dw_wview',v);
  $('w-dash-wrap').style.display=v==='dash'?'':'none';
  $('w-list-wrap').style.display=v==='list'?'':'none';
  $('w-game-wrap').style.display=v==='game'?'':'none';
  if(v==='game'&&!G.init) gStart(); else if(v==='game'&&G.mode==='daily'&&G.date!==today()&&(G.over||!G.guesses.length)) gStart(); else if(v==='game') gRender();
  document.querySelectorAll('#w-view button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
document.querySelectorAll('#w-view button').forEach(b=>b.onclick=()=>setWView(b.dataset.v));
addMode(localStorage.getItem('dw_amode')||'word'); setWView(localStorage.getItem('dw_wview')||'dash');

initCal();fillSettings();refreshWho();render();renderW();
if(!cfg().user) tab('set'); else {load();loadW();}
if('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
oqPaint(); flushQ();
</script>
